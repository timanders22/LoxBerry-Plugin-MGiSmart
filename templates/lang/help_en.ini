; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "MG iSmart"
K02 = "Brings the data of an <b>MG electric vehicle</b> (iSMART / SAIC) into Loxone — state of charge, range, charging power, doors, climate, location — and sends commands back: stop charging, target state of charge, charging current limit, pre-conditioning, „find my car“."
K03 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K04 = "How it works"
K05 = "MG/SAIC offers no open interface; the app talks to the servers over an encrypted, token-based protocol. The open-source project <a href='https://github.com/SAIC-iSmart-API/saic-python-mqtt-gateway' target='_blank'>SAIC MQTT Gateway</a> reproduces that protocol and publishes the vehicle data over MQTT."
K06 = "This plugin builds on it:"
K07 = "Reimplementing the SAIC API in PHP would be a large effort and would break with every change at the far end. The <b>Set up gateway</b> tab contains the complete <code>docker run</code> command and the pitfalls."
K08 = "Features"
K09 = "<b>Loxone line</b> with state of charge (% and kWh), target SoC, range, charging state, plug, charging power, remaining charging time, odometer, 12 V voltage, locking, inside and outside temperature"
K10 = "<b>Control commands</b> from a fixed, checked list — the endpoint accepts nothing else: stop/start charging, target SoC 60–100 %, charging current 6/8/16 A/MAX, pre-conditioning, rear window heating, find my car, fetch state now"
K11 = "<b>Messages</b> for Loxone: target state of charge reached, cable plugged in or out, car left unlocked — as <code>PUSHAKTIV=1</code> for an adjustable window"
K12 = "<b>Robust mapping</b>: the plugin looks for every value under several possible topic names. If a model does not supply something, <code>-1</code> arrives instead of an error"
K13 = "<b>Debug view</b> with all received MQTT topics — the vehicle ID is in there too"
K14 = "Tabs: Settings, Set up gateway, Loxone integration (including a complete list of blocks), Test, Log"
K15 = "Endpoints"
K16 = "Important notes"
K17 = "<b>12 volt battery:</b> polling wakes the vehicle electronics. The gateway's idle interval (default: once a day) should not be shortened. For fresh values use <code>?cmd=auffrischen</code> deliberately."
K18 = "<b>Only one session:</b> if the iSMART app signs in, the gateway pauses for about 15 minutes."
K19 = "<b>„Start charging“ is unreliable</b>, „stop charging“ works well. Switching through the wallbox is the safer route; the car's charging current limit, by contrast, works reliably."
K20 = "The interface is <b>unofficial</b> and may change at any time."
K21 = "Prerequisites"
K22 = "The LoxBerry plugin <b>Docker</b> (for the gateway container)"
K23 = "The package <b>mosquitto-clients</b> (installed along with the plugin)"
K24 = "An iSMART account with a registered vehicle"
K25 = "Privacy"
K26 = "The <b>iSMART password is known only to the gateway container</b> — this plugin does not need it. Broker credentials are kept in <code>config/plugins/mgismart/mg.json</code>, and that file is set to <code>chmod 600</code>. Passwords are masked in the log. The plugin contains <b>no personal data</b>."
K27 = "Call"
K28 = "Purpose"
K29 = "<code>/plugins/mgismart/mg.php</code>"
K30 = "Loxone line <code>MG;OK=..;SOC=..;ZIEL=..;LAEDT=..;…</code>"
K31 = "<code>/plugins/mgismart/mg.php?cmd=ziel_80</code>"
K32 = "Command to the vehicle"
K33 = "<code>/plugins/mgismart/mg.php?json=1</code>"
K34 = "State as JSON"
K35 = "<code>/plugins/mgismart/mg.php?debug=1</code>"
K36 = "all received MQTT topics"
K37 = "<code>/plugins/mgismart/mg.php?refresh=1</code>"
K38 = "Read the values again immediately"
K39 = "<code>/plugins/mgismart/mg.php?ptest=1</code>"
K40 = "Trigger a test push message"
