; Generated from the same table as help.html and help_de.ini.

[HILFE]
K01 = "MG iSmart"
K02 = "This plugin brings the data of one or more MG electric vehicles into Loxone and sends commands back."
K03 = "It does not talk to MG itself but reads the values from an MQTT broker, where they are published by the open-source SAIC MQTT gateway, a Docker container."
K04 = "The path of the data"
K05 = "Vehicle - iSMART server - SAIC MQTT gateway (Docker) - MQTT broker - this plugin - Loxone"
K06 = "Only the gateway container needs the iSMART password. The plugin keeps it in its configuration (mode 0600) so that it can create the container, and never displays it."
K07 = "The tabs in order"
K08 = "<b>Settings</b> - control, throttling, home zone, notifications and the two automations."
K09 = "<b>MQTT</b> - everything to do with topics: broker credentials (by default those of LoxBerry), topic prefix, iSMART user name, the vehicles and the own publication. It also holds the table of all topics the plugin sends itself."
K10 = "<b>Set up gateway</b> - enter iSMART e-mail and password; the plugin creates the gateway container itself and shows its state as status lights."
K11 = "<b>Loxone integration</b> - eight steps, the complete block list and the two templates for Loxone Config."
K12 = "<b>Charging sessions</b> - the recorded charging sessions with duration, kWh and consumption per 100 km."
K13 = "<b>Test</b> - the self-check. It answers without Loxone whether the setup holds. A dash is not a tick; it means: could not be determined."
K14 = "<b>Log files</b> - state changes, commands and errors. Password and keyword appear masked."
K15 = "The endpoints"
K16 = "Call"
K17 = "Purpose"
K18 = "mg.php"
K19 = "the complete Loxone line"
K20 = "mg.php?zeile=laden"
K21 = "charging values only, own polling interval"
K22 = "mg.php?fahrzeug=2"
K23 = "the second configured vehicle"
K24 = "mg.php?json=1"
K25 = "the state as JSON"
K26 = "mg.php?cmd=ziel&amp;prozent=80&amp;token=T"
K27 = "command to the vehicle"
K28 = "mg.php?selftest=1&amp;token=T"
K29 = "only check whether the keyword is correct"
K30 = "Why some calls need a keyword"
K31 = "mg.php lives in the unauthenticated area so that Loxone can reach it without credentials. Every call that triggers something is therefore protected by a keyword - and since 1.1.0 the debug view as well: it contains the iSMART user name, the vehicle id and the location topics."
K32 = "If a new keyword is created, all addresses entered in Loxone must be updated. A virtual output does not evaluate the answer - the failure would otherwise be silent."
K33 = "The 12 volt battery"
K34 = "Every query and every command wakes the vehicle electronics. The gateway developers explicitly warn about draining the 12 volt battery. The plugin therefore throttles: minimum interval per command, hourly limit, and a command whose target state is already active is not sent at all."
K35 = "What a value of minus one means"
K36 = "Not every model delivers every value. If one is missing, the plugin sends -1, or -99 for temperatures. That is not a measurement but the statement not known. The template for Loxone Config sets MinVal accordingly so that the placeholder really arrives as a negative number and can be told apart from a genuine zero."
K37 = "Charging schedule: documented, but not verified"
K38 = "The charging schedule and the battery heating schedule sit behind their own checkbox, which is off by default. The shape of the message is documented - it comes from the gateway source, not from a guess. Whether the vehicle accepts the schedule has not been tried on a car, and no source can answer that. These commands therefore report OK=2, meaning sent with unknown result, instead of claiming a success."
K39 = "There is a second plugin for the same car"
K40 = "The plugin by Michael Schlenstedt also installs and operates the gateway itself. Both claim the folder name mgismart; LoxBerry appends a number to the second one. Each creates only its own container, recognisable by the label carrying the folder name, and leaves the other one alone. And the MQTT gateway comes in two versions: V1 needs the subscription entered by hand, V2 discovers the topic group by itself. The Loxone integration tab reads the version from general.json and shows the matching sentence."
K41 = "License"
K42 = "MIT."
K43 = "The gateway container"
K44 = "The plugin creates a container named lb-&lt;folder&gt;-saic-gateway from the image saicismartapi/saic-python-mqtt-gateway, with --network host and --restart unless-stopped. It carries the labels de.loxberry.plugin.folder, .name, .def and .brokerhash. iSMART e-mail and password, broker address, user and password, the topic prefix and the battery size per vehicle are passed via an environment file (mode 0600) that is deleted right afterwards, never via a command line. The plugin does not set the iSMART server address or the region; the defaults of the gateway apply."
K45 = "Every action - restart, removal, log - only affects a container with the own labels. Anyone running the gateway additionally by hand does so without these labels; the plugin never touches such a container, and one with the same name only prevents creation. No cycle and no installation step starts, stops or removes the container; only uninstalling removes the own one, the image stays."
K46 = "Worth knowing: docker inspect shows the environment variables of the container including passwords in plain text, and anyone in the group docker may call it. If the broker password is changed in LoxBerry, the container still knows the old one - the status lights then show yellow, and the gateway has to be created again."
K47 = "The broker credentials"
K48 = "By default the plugin takes address, port, user and password of the broker from the LoxBerry configuration (System - MQTT Gateway); the MQTT tab shows where they come from. Own settings apply only behind the tick Use own broker settings: with a user, or without login for a broker on another machine. A password never appears on the page. If the broker rejects the login, is not reachable, or nothing lies below the prefix, the Test tab says so with a sentence of its own."
K49 = "When OK=1 holds"
K50 = "OK is 1 when the snapshot is at most 3 minutes old (three times the cycle) and the gateway has not reported offline via its last will - in all lines, including laden and ort."
K51 = "Login to MG"
K52 = "The gateway reports the last successful login to MG under account/lastLogin and the last failed one under account/lastLoginError. If the error is newer than the login, or if there is only the error, the status lights in the tab Set up gateway show red: login to MG failed, with time and text. Then check the iSMART e-mail and password (most reliably in the iSMART app) and create the gateway again. If both topics are missing or cannot be read, that means unknown, not fine; the status lights then show grey. Via MQTT the state goes out with every cycle as &lt;prefix&gt;/gateway/anmeldung (1 fine, 0 failed, - unknown), not retained, like ok, because it is a statement of the gateway about itself; in the JSON of the endpoint it is _gateway_anmeldung. Whether the gateway last reached every vehicle is a separate question."
K53 = "LoxBerry health check"
K54 = "The plugin reports to the LoxBerry health check (bin/healthcheck) with five points: is the cycle running, does the broker accept the login, is the gateway container running (only if the plugin set it up), did the login to MG succeed, and are the values at most 3 minutes old. Judged is the age of the values, not a single retrieval. Docker and the broker are only asked with a short time limit; nothing is written. A command the vehicle did not accept (for instance return code 4, the vehicle is asleep) is only a note, not an error. The same points are shown in the tab Test."
K55 = "Update gateway image"
K56 = "The button in the tab Set up gateway fetches the image again (docker pull, in the background, at most 15 minutes). If the own container already runs this image, everything stays as it is. Otherwise the plugin stops only its own container (recognisable by the label of the plugin), removes it and creates it again with the same settings. If that fails, the tab names the reason; credentials and settings stay stored, and Create and start gateway sets it up again. The status lights show the version the gateway reports under account/gatewayVersion, plus image and digest of the running container. It is never updated by itself."
