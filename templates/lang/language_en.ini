N_STECKER = "Charging cable plugged or unplugged"
N_VOLL = "Charge target reached"
ORT_EIN = "Compute home zone (ZUHAUSE and ENTFERNUNG)"
ORT_HILFE = "Latitude, longitude and radius yield two fields for Loxone: <b>ZUHAUSE</b> (1 when the car is inside the zone) and <b>ENTFERNUNG</b> in kilometres. The <i>raw coordinates</i> deliberately do not go into the Loxone line — they appear only on the Test tab and in the debug view, which is protected by the keyword."
PLAN_BIS = "Charging window end (HH:MM)"
PLAN_EIN = "Enable charging and battery heating schedule (not verified)"
PLAN_HILFE = "When enabled, six commands appear: <span class='sm-mono'>ladeplan_ein</span> and <span class='sm-mono'>ladeplan_aus</span> switch the window configured below, the same for the heating schedule, and <span class='sm-mono'>ladeplan</span> respectively <span class='sm-mono'>heizplan</span> take times directly in the address. These commands report <span class='sm-mono'>OK=2</span> — sent, result unknown: the state topic carries JSON, and a text comparison would match by chance sometimes and sometimes not. A success nobody verified is not claimed here."
PLAN_MODUS = "Mode of the charging schedule"
PLAN_MODUS_HILFE = "The three values come from <span class='sm-mono'>ScheduledChargingMode</span> in the gateway client library. <i>Until target state of charge</i> is ignored by the gateway if the vehicle does not support a target state of charge — it writes a warning to its log and does nothing."
PLAN_VON = "Charging window start (HH:MM)"
PLAN_WARNUNG = "<b>Not verified.</b> The shape of the message is documented — it comes from the gateway source, not from a guess. Whether the <i>vehicle</i> accepts the schedule has not been tried on a car here, and no source can answer that. This group therefore sits behind its own checkbox and is off by default."
PUSH_HILFE = "When one of the events occurs, <span class='sm-mono'>PUSHAKTIV=1</span> is set for that time. Loxone sends the push and the notification block sees the edge."
PUSH_MINUTEN = "Notification window in minutes"
