CHECK_HILFE = "The <b>semicolon in the search text is not decoration</b>: without it <span class='sm-mono'>\iKM=</span> could hit the wrong occurrence in a line that also contains <span class='sm-mono'>KMTAG=</span> — Loxone takes the first one. Not every model delivers every value; if one is missing, <span class='sm-mono'>-1</span> is sent (<span class='sm-mono'>-99</span> for temperatures). So do not compute blindly in Loxone, but check for <span class='sm-mono'>greater or equal 0</span> first; the template sets <span class='sm-mono'>MinVal</span> accordingly so that the placeholder really arrives as a negative number."
