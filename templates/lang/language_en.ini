Z1_21 = "Status | Zustand (MG) | Rows: V8 < 0 “plugin has not run since the LoxBerry started, or it is not set up – in the plugin start with the tab ‘Set up gateway’”; V1 = 1 “sign of life missing for at least 15 minutes – LoxBerry or minute run of the plugin stopped; open the LoxBerry in the browser, in the plugin tab Test ‘Read values now’”; V6 < 0 “never read from the broker – in the plugin tab Set up gateway enter the iSMART e-mail and password, ‘Create and start gateway’, then enter the vehicle in the tab MQTT”; V3 = 0 “gateway container offline – in the plugin tab Set up gateway ‘Restart’ and read the status lights”; V7 = 0 “no values come from the gateway for this vehicle – check the MG login and the vehicle ID (status lights in the tab Set up gateway)”; V6 > 3 “reading stopped – snapshot <v6> min old; look in the plugin tab Test whether the broker answers”; V4 = 0 “the gateway does not reach the vehicle (asleep, underground car park, no signal) – last vehicle query <v5> min ago”; V2 = 0 “no valid values (no state of charge reported) – look at the plugin tab Test”; without condition “running – last vehicle query <v5> min ago, <v7> values from the gateway”; visualisation ON | V1 = output E of #16, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7, V8 = #2"
