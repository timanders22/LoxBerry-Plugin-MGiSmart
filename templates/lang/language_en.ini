[GW]
H_WARUM = "Why an additional container"
S5_HINWEIS = "Two more peculiarities: <b>start charging</b> is considered unreliable, whereas <i>stop charging</i> works reliably — the charge current limit, by contrast, works well. And if the iSMART app logs in, the gateway pauses for about 15 minutes."
S5_TITEL = "Please leave the polling intervals alone"
S5_WARNUNG = "<b>Polling wakes the vehicle electronics.</b> The gateway developers explicitly warn about draining the <b>12 volt battery</b>. The idle interval (default: once a day) should not be shortened. The right way is targeted rather than continuous: <span class='sm-mono'>?cmd=auffrischen</span>."
WARUM = "MG/SAIC does not offer an open interface; the app talks to the servers over an encrypted, token-based protocol. The open-source <b>SAIC MQTT gateway</b> reimplements that protocol and publishes the vehicle data over MQTT. Rewriting it in PHP would be laborious and would break with every change on the other side."
