Z4_19 = "Virtual HTTP Input Command (template “MG 1 (Gesamt)”) | MG_RDHR | Tyre pressure rear right in bar | —"
Z4_20 = "NOT | Nicht verriegelt (MG) | — | I = #1"
Z4_21 = "Greater | Tür oder Haube offen (MG) | V2 = 0 (leave the second input open; -1 = unknown does not count) | I1 = #2"
Z4_22 = "Greater | Fenster oder Dach offen (MG) | V2 = 0 (leave the second input open; -1 = unknown does not count) | I1 = #3"
Z4_23 = "OR | Nicht verriegelt oder Tür offen (MG) | — | I1 = #20, I2 = #21"
Z4_24 = "OR | Fenster oder Kofferraum offen (MG) | — | I1 = #22, I2 = #4"
Z4_25 = "OR | Fahrzeug offen (MG) | — | I1 = #23, I2 = #24"
Z4_26 = "Formula | Abgestellt und Daten frisch (MG) | IF(I1>0;0;I2) – 1 only if the ignition is off AND the values are valid | I1 = #5, I2 = #6"
Z4_27 = "AND | Offen und abgestellt (MG) | — (while driving “not locked” does not count) | I1 = #25, I2 = #26"
Z4_28 = "Switch-On Delay | Offen seit 5 Minuten (MG) | 300 s (no message while loading and unloading) | Input = #27"
Z4_29 = "Notification | Meldung Fahrzeug offen (MG) | Text: MGiSmart – the parked vehicle has not been locked for 5 minutes, or a door, the bonnet, a window, the sunroof or the boot is open. Read “Türen und Fenster (MG)” in the app | Input = #28"
Z4_30 = "Formula | Kleinster Reifendruck (MG) | MIN(MIN(IF(I1>0;I1;9);IF(I2>0;I2;9));MIN(IF(I3>0;I3;9);IF(I4>0;I4;9))) – a pressure not reported (-1 or 0) counts as 9 bar and triggers nothing | I1 = #16, I2 = #17, I3 = #18, I4 = #19"
Z4_31 = "Threshold Switch | Reifendruck niedrig (MG) | On 2.2 / Off 2.4 (bar; switches on below 2.2 bar, off again above 2.4 bar) | Input = #30"
Z4_32 = "Switch-On Delay | Reifendruck niedrig bestätigt (MG) | 600 s (two polls; swallows the pulse of the threshold switch at every poll) | Input = #31"
Z4_33 = "Notification | Meldung Reifendruck niedrig (MG) | Text: MGiSmart – a tyre has less than 2.2 bar. Pressures in the app under “Reifen und 12-V-Batterie (MG)”; check and inflate the tyres | Input = #32"
Z4_34 = "Status | Türen und Fenster (MG) | Rows: V6 = 1 “open for more than 5 minutes – please check (doors/bonnet <v2>, windows/roof <v3>, boot <v4>, locked <v1>)”; V2 > 0 “<v2> door(s) or bonnet open – windows open: <v3>”; V3 > 0 “<v3> window(s) or sunroof open – locked: <v1>”; V4 = 1 “boot open – locked: <v1>”; V1 = 0 and V5 = 1 “ignition on – not locked”; V1 = 0 “everything closed, but not locked”; V1 < 0 “lock unknown – read the status ‘Zustand (MG)’”; without condition “locked, everything closed”; visualisation ON | V1 = #1, V2 = #2, V3 = #3, V4 = #4, V5 = #5, V6 = #28"
Z4_35 = "Status | Standort und Fahrt (MG) | Rows: V6 > 0 “driving <v6> km/h – <v2.1> km straight-line from home; today <v4> km”; V1 = 1 “at home – today <v4> km, since the last charge <v5> km (<v8.1> kWh); odometer <v3> km”; V2 > 0 “on the road – <v2.1> km straight-line from home; today <v4> km, <v7.1> kWh; odometer <v3> km”; without condition “location unknown – in the plugin tab Settings enter the home zone (latitude, longitude, radius); today <v4> km, <v7.1> kWh; odometer <v3> km”; visualisation ON | V1 = #8, V2 = #9, V3 = #10, V4 = #11, V5 = #12, V6 = #7, V7 = #13, V8 = #14"
Z4_36 = "Status | Reifen und 12-V-Batterie (MG) | Rows: V5 = 1 “tyre pressure low – front <v1.1> / <v2.1> bar, rear <v3.1> / <v4.1> bar; check the tyres”; V6 > 0 and V6 < 12 “12-V battery only <v6.1> V – after a long standstill check the battery”; without condition “front <v1.1> / <v2.1> bar, rear <v3.1> / <v4.1> bar; 12-V battery <v6.1> V”; visualisation ON | V1 = #16, V2 = #17, V3 = #18, V4 = #19, V5 = #32, V6 = #15"
SEITE1_SCHRITT1 = "In the plugin tab “Set up gateway” enter the iSMART e-mail and the password, “Create and start gateway”; the status lights must show “container running”, “login at MG” and “values arrive”. In the tab “MQTT” enter the vehicle. For location statements enter the home zone (latitude, longitude, radius) in the tab “Settings”. Tab “Test” → “Fetch Loxone line”: MG;OK=1;… arrives with numbers."
SEITE1_SCHRITT2 = "This tab, section “Create everything at once”: line “Complete”, vehicle 1 → “Create template for Loxone Config”, plus “Create template for the commands”. In Loxone Config: Periphery → Virtual Inputs → import template (container “MG 1 (Gesamt)”), Periphery → Virtual Outputs → import template (“MG 1 (Steuerbefehle)”). Import each only ONCE (twice gives duplicate blocks). The lines “Laden”, “Ort und Fahrt”, “Technik” are not needed."
SEITE1_SCHRITT3 = "Create the page “MGiSmart”, drag the 14 commands from “MG 1 (Gesamt)” onto it (no. 1–14), plus the constant 1."
SEITE1_SCHRITT4 = "Create three notifications (Periphery → Messages → Notification), text as in the list."
SEITE1_SCHRITT5 = "Remaining blocks via the block search (F5), parameters as in the list, connect from top to bottom. Value Validator no. 16: remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise the constant 1 arrives as 0). AND no. 27: invert input I2 – in Config click on the input point, afterwards the input shows a small circle. Edge Detection no. 32: use output Off. Status “Zustand (MG)” and “Ladestand und Reichweite (MG)” four times “+” each; rows in the order given, the one without condition last. Switch on “Statistics” in the properties window of MG_SOC and MG_REICHWEITE."
SEITE1_SCHRITT6 = "Save and transfer. Check: “Zustand (MG)” shows “läuft – letzte Fahrzeugabfrage vor … min”; MG_ZAEHLER counts on by 5 every 5 minutes."
SEITE1_H1 = "The fault message arrives after 10 minutes without valid data; a stopped LoxBerry is detected by the page after about 25 minutes (15 minutes without a new counter value plus 10 minutes confirmation)."
SEITE1_H2 = "On no. 2 and 16: if the LoxBerry stops, all inputs keep their last value; only the stopped run counter gives it away. ALTER and FZALTER are no use for this (ALTER stays at 0 in normal operation, FZALTER while charging)."
SEITE1_H3 = "A sleeping car is not a fault of the plugin. If the gateway reports the vehicle as “not reached”, however, OK is 0 and the fault message arrives as well – the status then says “Gateway erreicht das Fahrzeug nicht”."
SEITE1_H4 = "On no. 22/24: -1 means “not reported” and must not count as “low”. On no. 23/25: a threshold switch behind a polled input gives a short pulse at every poll; the switch-on delay no. 28 before the message swallows it."
SEITE1_H5 = "Second vehicle: fetch the templates for vehicle 2 in this tab (names MG2_…, containers “MG 2 (Gesamt)” and “MG 2 (Steuerbefehle)”) and copy the four pages with these names; route the fault of the second car through a further OR before no. 19."
SEITE1_H6 = "After “Create new keyword” in the plugin fetch the command template again and reconnect the outputs (the addresses carry the keyword); the input template needs no keyword."
SEITE1_H7 = "The plugin’s own messages (charged, cable, unlocked, window, command failed) are not used by the sample – they would duplicate the pages. If you only want those, hang a notification on MG_PUSHAKTIV."
SEITE2_SCHRITT1 = "Containers from page “MGiSmart”, step 2 (do not import again). “Allow control commands” is on by default in the plugin."
SEITE2_SCHRITT2 = "New page, drag the 17 commands from “MG 1 (Gesamt)” onto it (MG_LAEDT, MG_STECKER, MG_SOC, MG_RESTZEIT once more), SPOT_RANK from the container “Spotpreis aWATTar” and the four virtual output commands from “MG 1 (Steuerbefehle)” (target state of charge, charging current limit, battery heating, start charging)."
SEITE2_SCHRITT3 = "Create the sliders “Ladegrenze (MG) (Proz)”, “Ladestrom (MG) (A)” and the switches “Batterieheizung (MG)”, “Laden nach Empfehlung (MG)”, “Laden von Hand (MG)” (Periphery → Virtual Inputs), values as in the list."
SEITE2_SCHRITT4 = "Remaining blocks via F5; with “Greater” and “Less or Equal” leave the second input open and set V2 in the properties window. “+”: “Laden (MG)” and “Ladetechnik (MG)” four times each. “Statistics” on MG_ACLEISTUNG."
SEITE2_SCHRITT5 = "Save and transfer. Check: plug in the cable – after the next poll (up to 5 minutes) “Laden (MG)” shows “Kabel steckt, lädt nicht” or “lädt mit … kW”; set the target state of charge to 70 percent – after the next vehicle query the status shows 70."
SEITE2_H1 = "“Laden nach Empfehlung” charges in the four cheapest hours according to the spot price plugin, only at home; the cheap hour comes from the spot price plugin, Loxone decides (no. 26–33). Without the spot price plugin SPOT_RANK stays free (then never cheap). With EVCC at the wallbox leave this switch OFF – EVCC controls there (pages “EVCC …”); likewise leave the plugin’s own charging recommendation (tab Settings) off: two controllers on the same car work against each other."
SEITE2_H2 = "“Laden starten” is considered unreliable in the gateway project; “Laden stoppen” works reliably. If you want to release charging reliably, control the wallbox (pages “EVCC …”) and leave the car permanently ready to charge."
SEITE2_H3 = "Release sliders in the app instead of dragging: every new value is a command; the plugin lets through at most 30 per hour, the charging current limit only every 5 minutes."
SEITE2_H4 = "Charging current: the sample only knows 6 and 16 A. The plugin also accepts 8 A and MAX (32); if you need them, set the slider to Min 6, Max 32 and choose the steps by hand."
SEITE2_H5 = "Do not control by surplus at a DC charging station – “Ladetechnik (MG)” says when both plugs are detected and no AC flows."
SEITE3_SCHRITT1 = "Containers as on page “MGiSmart”, step 2."
SEITE3_SCHRITT2 = "New page, drag the 9 commands from “MG 1 (Gesamt)” and the 11 virtual output commands of the list onto it; drag “Anwesenheit (eigene Quelle)” from the tree, or create it once as a virtual input and feed it from your own presence detection."
SEITE3_SCHRITT3 = "Create three sliders (target temperature, seat heating left and right), two switches (rear window and windscreen heating) and five push buttons (Klima jetzt, Klima aus, Klima nur vorn, Nur lüften, Jetzt abrufen)."
SEITE3_SCHRITT4 = "Place the schedule “Abfahrt vorklimatisieren (MG)” via F5 and enter your own departure days: start 20 minutes before departure, end at departure; its output AQ to the AND no. 17. Remaining blocks via F5. “+”: “Klima (MG)” four times."
SEITE3_SCHRITT5 = "Save and transfer. Check: press “Klima jetzt” – after the next vehicle query “Klima (MG)” shows “Standklima läuft – Ziel … °C”; “Klima aus” switches it off."
SEITE3_H1 = "On no. 13/19: the temperature is a separate command and applies to the next switch-on; the switch-on command itself carries no temperature. Set the slider first, then “Klima jetzt”. “Standklima einschalten” has no OFF command (otherwise releasing the button or the end of the schedule would switch the climate control off again at once) – “Klima aus” is a separate command."
SEITE3_H2 = "If you use the plugin’s own preconditioning (departure assistant, tab Settings), leave out the schedule no. 15 – otherwise two paths request it."
SEITE3_H3 = "“Auto finden”, locking and unlocking and the boot are missing on purpose: they need the second tick in the plugin and do not belong on an app button. Charging and battery heating schedule (third tick) are not tested on a vehicle and are missing as well."
SEITE3_H4 = "Polling mode and polling intervals of the gateway are in the command template but not wired; set them in the plugin."
SEITE3_H5 = "“Jetzt abrufen” wakes the vehicle; do not hang it on a clock."
SEITE4_SCHRITT1 = "Containers as on page “MGiSmart”, step 2."
SEITE4_SCHRITT2 = "New page, drag the 19 commands onto it (MG_LAEUFT, MG_OK, MG_ZUHAUSE once more); “Statistics” on MG_KM."
SEITE4_SCHRITT3 = "Create two notifications: “Meldung Fahrzeug offen (MG)”, “Meldung Reifendruck niedrig (MG)”."
SEITE4_SCHRITT4 = "Remaining blocks via F5; with the two “Greater” leave the second input open, V2 = 0. “+”: “Türen und Fenster (MG)” twice, “Standort und Fahrt (MG)” four times, “Reifen und 12-V-Batterie (MG)” twice."
SEITE4_SCHRITT5 = "Save and transfer. Check: leave the parked car unlocked – after the next vehicle query and 5 minutes the message arrives."
SEITE4_H1 = "The open message only applies to a parked car with valid data (no. 26/27: while driving the car is not locked – without this condition “open” would come on every drive); during a fault it stays silent."
SEITE4_H2 = "On no. 30: -1 means “not reported” and does not count as low. On no. 31: the threshold switch gives a short pulse at every poll; the switch-on delay no. 32 swallows it."
SEITE4_H3 = "Doors and windows arrive as a count; which ones are open is only in the plugin’s MQTT publication (tab MQTT)."
SEITE4_H4 = "Without a home zone in the plugin “at home” and the distance stay empty; the status says so. The raw coordinates do not go to Loxone on purpose."
SEITE4_H5 = "Daily distance and daily consumption are counted by the vehicle itself – no pulse at 0:00 needed."
