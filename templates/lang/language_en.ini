H = "Loxone integration, step by step"
H_VORLAGE = "Create everything at once"
MERKWORT = "Current keyword"
MERKWORT_HINWEIS = "<b>Commands need this keyword.</b> The address <span class='sm-mono'>mg.php</span> lives in the unauthenticated area so that Loxone can reach it without credentials — therefore every <i>switching</i> call and the debug view are protected by <span class='sm-mono'>&amp;token=…</span>. The addresses below already contain it. <b>If a new keyword is created, all addresses below must be re-entered in Loxone.</b>"
NAME = "Name (suggestion)"
PARAMETER = "Parameters"
S1 = "<b>MQTT is the standard route</b>, HTTP the alternative. Over MQTT the gateway creates the names of the virtual inputs itself — in Loxone a suitably named input is enough. The HTTP route needs its own command recognition per value, but requires no subscription and no running gateway service. Both routes can be combined."
S1_TITEL = "Step 1: Decide on the route"
S2 = "System &rarr; MQTT Gateway &rarr; Subscriptions:"
S2_TITEL = "Step 2: Enter the subscription in the MQTT gateway"
S3 = "Four lines with their own polling interval. If you want everything in one input, take only the first — it contains every field. The other three are shorter and may therefore be polled more or less often."
S3_TITEL = "Step 3: Create virtual HTTP inputs"
S4 = "The template below creates all inputs at once. The table remains nevertheless — it explains what is being imported."
S4_TITEL = "Step 4: Command recognitions"
S5 = "The address of the output is the host name; the path is given per command in the <i>Command when ON</i> column."
S5_TITEL = "Step 5: Virtual output for commands"
S6 = "A virtual input <b>keeps its last value</b> when nothing arrives any more — in the app everything then looks normal. Hence three fields that make the failure visible: <span class='sm-mono'>OK</span> (record valid), <span class='sm-mono'>ERREICHBAR</span> (the gateway reached the vehicle) and <span class='sm-mono'>FZALTER</span> (minutes since the last real status query). <b>Do not wire to ALTER</b>: it only measures the path to the broker and stays small even when the car has been silent for days — the values sit retained on the broker. Set the failure threshold well above the polling interval so that a single missed run does not raise an alarm."
S6_TITEL = "Step 6: Failure detection"
S7 = "Working through the table from top to bottom rebuilds the function. The blocks are found in Loxone Config via the block search (F5)."
S7_TITEL = "Step 7: Complete block list to rebuild"
S8 = "Call both addresses in a browser. The self-test switches nothing and does not touch the vehicle — it answers only the question whether the keyword is correct."
S8_TITEL = "Step 8: Verification"
TAKT = "Polling interval"
TOKEN_NEU_HILFE = "A new keyword invalidates <b>all</b> addresses above. After that the endpoint returns HTTP 403 for the old addresses — and a virtual output does not evaluate the answer, so the failure would be silent. Only press this if the previous keyword may have fallen into the wrong hands."
VORLAGE_FAHRZEUG = "Which vehicle"
VORLAGE_TEXT = "The templates create all virtual inputs respectively outputs including title, comment, unit and limits. In Loxone Config via <i>File &rarr; Import template</i>. <b>Loxone Config creates new objects on import and overwrites nothing — importing twice yields duplicate blocks.</b> The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
VORLAGE_ZEILE = "Which line"
WANN = "When"
WARNUNG_DATEN = "<b>What travels over MQTT here is more than a number.</b> The topics carry the location of the vehicle, and the commands switch climate, charging and — where enabled — lights, horn and the locks. Anyone with access to the broker or to the keyword can locate and operate the car. So do not expose the broker to the internet, do not pass on the keyword, and secure access to LoxBerry and the Miniserver accordingly. The interface is unofficial; use is at your own risk."
WERT = "Value"
WIRKUNG = "Effect"
ZEILE = "Line"
ZEILEN_HILFE = "Polling the plugin costs nothing and does not wake the <i>car</i> — only the cache is queried. How often the vehicle itself is asked is determined solely by the gateway."

