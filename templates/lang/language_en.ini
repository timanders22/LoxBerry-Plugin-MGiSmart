H = "Loxone integration, step by step"
H_VORLAGE = "Create everything at once"
MERKWORT = "Current keyword"
MERKWORT_HINWEIS = "<b>Commands need this keyword.</b> The address <span class='sm-mono'>mg.php</span> lives in the unauthenticated area so that Loxone can reach it without credentials — therefore every <i>switching</i> call and the debug view are protected by <span class='sm-mono'>&amp;token=…</span>. The addresses below already contain it. <b>If a new keyword is created, all addresses below must be re-entered in Loxone.</b>"
NAME = "Name"
PARAMETER = "Parameters"
S1 = "<b>MQTT is the standard route</b>, HTTP the alternative. Over MQTT the gateway creates the names of the virtual inputs itself — in Loxone a suitably named input is enough. The HTTP route needs its own command recognition per value, but requires no subscription and no running gateway service. Both routes can be combined. <b>The sample project uses the HTTP line “Complete”</b> with the template from the section “Create everything at once” (block lists in step 7)."
S1_TITEL = "Step 1: Decide on the route"
S2 = "System → MQTT Gateway → Subscriptions:"
S2_TITEL = "Step 2: The subscription in the MQTT gateway"
S3 = "Four lines with their own polling interval. If you want everything in one input, take only the first — it contains every field. The other three are shorter and may therefore be polled more or less often."
S3_TITEL = "Step 3: Create virtual HTTP inputs"
S4 = "The template below creates all inputs at once. The table remains nevertheless — it explains what is being imported."
S4_TITEL = "Step 4: Command recognitions"
S5 = "The address of the output is the host name; the path is given per command in the <i>Command when ON</i> column. Analog commands carry <span class='sm-mono'>&lt;v.0&gt;</span>: Loxone inserts the value of the output there as a whole number – the plugin accepts target state of charge, charging current, seat heating and polling intervals only as whole numbers. Since 1.1.26 “Standklima einschalten” no longer carries an OFF command in the template; switching off is done with the separate command <span class='sm-mono'>klima_aus</span>."
S5_TITEL = "Step 5: Virtual output for commands"
S6 = "A virtual input <b>keeps its last value</b> when nothing arrives any more — in the app everything then looks normal. Two fields make the failure visible: <span class='sm-mono'>OK</span> drops to 0 as soon as the vehicle data are no longer valid (snapshot older than 3 minutes, gateway offline, vehicle not reached or no state of charge), and the run counter <span class='sm-mono'>ZAEHLER</span> counts on by one on every minute run of the plugin. If the LoxBerry itself stops, no answer arrives any more – then OK and ALTER also keep their last value, and only the stopped counter gives it away. The page “MGiSmart” in step 7 checks it with a <b>Value Validator</b> (Tmc 900 s, three times the polling time of 300 s) and reports “no fresh data” OR “sign of life missing” after 600 s – a single missed poll does not raise an alarm yet. <b>Do not wire to ALTER or FZALTER</b>: ALTER stays at 0 or 1 in normal operation, FZALTER while charging and driving; FZALTER on the other hand grows as long as the car sleeps – that alone is no fault."
S6_TITEL = "Step 6: Failure detection"
S7 = "Four pages, as they stand fully connected in the LoxBerry plugins sample project: monitoring with state of charge and range, charging, climate and commands, vehicle. For each page a box “How to take over this page”, the table (one row per block; Loxone Config lists them all in the block search, key F5), notes and a picture. No connection crosses a page boundary; inputs that appear on two pages are further instances there. If you only want to monitor, take over the first page."
S7_TITEL = "Step 7: block lists from the sample project (four pages)"
S8 = "Call both addresses in a browser. The self-test switches nothing and does not touch the vehicle — it answers only the question whether the keyword is correct."
S8_TITEL = "Step 8: Verification"
TAKT = "Polling interval"
TOKEN_NEU_HILFE = "A new keyword invalidates <b>all</b> addresses above. After that the endpoint returns HTTP 403 for the old addresses — and a virtual output does not evaluate the answer, so the failure would be silent. Only press this if the previous keyword may have fallen into the wrong hands."
VORLAGE_FAHRZEUG = "Which vehicle"
VORLAGE_TEXT = "The templates create all virtual inputs respectively outputs including title, comment, unit and limits. In Loxone Config via <i>File → Import template</i>. <b>Loxone Config creates new objects on import and overwrites nothing — importing twice yields duplicate blocks.</b> The address in the header is a suggestion; please check that the Miniserver reaches the LoxBerry under that name."
VORLAGE_ZEILE = "Which line"
WANN = "When"
WARNUNG_DATEN = "<b>What travels over MQTT here is more than a number.</b> The topics carry the location of the vehicle, and the commands switch climate, charging and — where enabled — lights, horn and the locks. Anyone with access to the broker or to the keyword can locate and operate the car. So do not expose the broker to the internet, do not pass on the keyword, and secure access to LoxBerry and the Miniserver accordingly. The interface is unofficial; use is at your own risk."
WERT = "Value"
WIRKUNG = "Effect"
ZEILE = "Line"
ZEILEN_HILFE = "Polling the plugin costs nothing and does not wake the <i>car</i> — only the cache is queried. How often the vehicle itself is asked is determined solely by the gateway."
ABO_ROH_WARNUNG = "<b>Raw topics only with care:</b> With MQTT gateway V1 every single gateway topic becomes its own HTTP call to the Miniserver, a noticeable load with several hundred topics per vehicle. The normal way is the own prefix above."
SCHRITTE_TITEL = "How to take over this page"
