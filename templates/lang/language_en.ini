[GW]
H_WARUM = "Why an additional container"
S1 = "There is a ready-made plugin for that: <b>Docker</b> by Michael Miklis. It installs Docker and <b>Portainer</b>, an interface for creating containers. It also works without that plugin — then via SSH."
S1_TITEL = "Step 1: Docker on the LoxBerry"
S2 = "The LoxBerry MQTT gateway must be running (System &rarr; MQTT Gateway), and an iSMART account with a registered vehicle is required. The iSMART password is known <b>only to the container</b> — this plugin does not need it."
S2_TITEL = "Step 2: Further prerequisites"
S3 = "Either in Portainer via <i>Add container</i> or on the LoxBerry via SSH:"
S3_HINWEIS = "If the broker requires authentication, additionally provide <span class='sm-mono'>-e MQTT_USER</span> and <span class='sm-mono'>-e MQTT_PASSWORD</span>. The line <span class='sm-mono'>HA_DISCOVERY_ENABLED=False</span> saves the Home Assistant topics, which nobody needs here."
S3_TITEL = "Step 3: Create the container"
S4 = "<span class='sm-mono'>docker logs -f saic-gateway</span> shows the login. Then click <i>Read values now</i> on the <b>Test</b> tab — the vehicle id appears there too."
S4_TITEL = "Step 4: Check"
S5_HINWEIS = "Two more peculiarities: <b>start charging</b> is considered unreliable, whereas <i>stop charging</i> works reliably — the charge current limit, by contrast, works well. And if the iSMART app logs in, the gateway pauses for about 15 minutes."
S5_TITEL = "Step 5: Please leave the polling intervals alone"
S5_WARNUNG = "<b>Polling wakes the vehicle electronics.</b> The gateway developers explicitly warn about draining the <b>12 volt battery</b>. The idle interval (default: once a day) should not be shortened. The right way is targeted rather than continuous: <span class='sm-mono'>?cmd=auffrischen</span>."
WARUM = "MG/SAIC does not offer an open interface; the app talks to the servers over an encrypted, token-based protocol. The open-source <b>SAIC MQTT gateway</b> reimplements that protocol and publishes the vehicle data over MQTT. Rewriting it in PHP would be laborious and would break with every change on the other side."

