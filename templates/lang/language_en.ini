WAS_IST_DAS = "<b>MG electric vehicles (iSMART/SAIC) in Loxone.</b> The plugin brings state of charge, range, charging power, doors, windows, tyre pressure, climate and location of one or more vehicles into Loxone and sends commands back, such as stop charging, target state of charge or climate control. The SAIC MQTT gateway fetches the data from the iSMART servers – as a Docker container that the Set up gateway tab creates at the push of a button; the plugin reads it from the MQTT broker and provides it to the Miniserver as ready-made lines over HTTP and over MQTT."

