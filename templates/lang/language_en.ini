MUSTERPROJEKT = "The complete project file with all plugin pages and templates: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry plugins sample project</a>"
S7_MEHRERE = "There are <b>%d vehicles</b> entered. The names in the tables apply to vehicle 1. For every further vehicle its number takes that place – inputs MG2_…, commands “MG2 …”, containers with its name –, exactly as in the template that the section “Create everything at once” creates with “Which vehicle”. The pages are rebuilt once per vehicle."

