S1 = "<b>MQTT ist der Regelweg</b>, HTTP die Alternative. Über MQTT erzeugt das Gateway die Namen der virtuellen Eingänge selbst — in Loxone genügt ein passend benannter Eingang. Der HTTP-Weg verlangt je Wert eine eigene Befehlserkennung, dafür braucht er kein Abo und keinen laufenden Gateway-Dienst. Beide Wege lassen sich mischen."
S1_TITEL = "Schritt 1: Den Weg festlegen"
S2 = "System &rarr; MQTT Gateway &rarr; Subscriptions:"
S2_TITEL = "Schritt 2: Abo im MQTT-Gateway eintragen"
S3 = "Vier Zeilen mit eigenem Abfragetakt. Wer alles in einem Eingang haben will, nimmt nur die erste — sie enthält jedes Feld. Die übrigen drei sind kürzer und dürfen deshalb öfter beziehungsweise seltener abgefragt werden."
S3_TITEL = "Schritt 3: Virtuelle HTTP-Eingänge anlegen"
S4 = "Die Vorlage weiter unten legt alle Eingänge auf einmal an. Die Tabelle bleibt trotzdem stehen — sie erklärt, was importiert wird."
S4_TITEL = "Schritt 4: Befehlserkennungen"
S5 = "Die Adresse des Ausgangs ist der Rechnername; der Pfad steht je Befehl in der Spalte <i>Befehl bei EIN</i>."
S5_TITEL = "Schritt 5: Virtueller Ausgang für Befehle"
S6 = "Ein virtueller Eingang <b>behält seinen letzten Wert</b>, wenn nichts mehr kommt — in der App sieht dann alles normal aus. Deshalb drei Felder, die den Ausfall sichtbar machen: <span class='sm-mono'>OK</span> (Datensatz gültig), <span class='sm-mono'>ERREICHBAR</span> (das Gateway hat das Fahrzeug erreicht) und <span class='sm-mono'>FZALTER</span> (Minuten seit der letzten echten Statusabfrage). <b>Nicht auf ALTER verdrahten</b>: das misst nur den Weg zum Broker und bleibt auch dann klein, wenn das Auto seit Tagen schweigt — die Werte liegen retained auf dem Broker. Die Ausfallschwelle deutlich über den Abholtakt legen, damit ein einzelner verpasster Durchlauf keine Meldung auslöst."
S6_TITEL = "Schritt 6: Ausfallerkennung"
S7 = "Wer die Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5)."
S7_TITEL = "Schritt 7: Komplette Baustein-Liste zum Nachbauen"
S8 = "Beide Adressen im Browser aufrufen. Der Selbsttest schaltet nichts und rührt das Fahrzeug nicht an — er beantwortet nur die Frage, ob das Merkwort stimmt."
S8_TITEL = "Schritt 8: Gegenprobe"
TAKT = "Abfragezyklus"
TOKEN_NEU_HILFE = "Ein neues Merkwort macht <b>alle</b> oben stehenden Adressen ungültig. Danach liefert der Endpunkt für die alten Adressen HTTP 403 — und ein virtueller Ausgang wertet die Antwort nicht aus, der Ausfall bliebe still. Nur drücken, wenn das bisherige Merkwort in fremde Hände geraten sein könnte."
VORLAGE_FAHRZEUG = "Welches Fahrzeug"
VORLAGE_TEXT = "Die Vorlagen legen alle virtuellen Eingänge beziehungsweise Ausgänge samt Titel, Kommentar, Einheit und Grenzen an. In Loxone Config über <i>Datei &rarr; Vorlage einlesen</i>. <b>Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine.</b> Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
VORLAGE_ZEILE = "Welche Zeile"
WANN = "Wann"
WARNUNG_DATEN = "<b>Was hier über MQTT läuft, ist mehr als eine Zahl.</b> Die Themen tragen den Standort des Fahrzeugs, und über die Befehle lassen sich Klima, Laden und — sofern freigegeben — Licht, Hupe und die Verriegelung schalten. Wer Zugriff auf den Broker oder auf das Merkwort bekommt, kann das Auto orten und bedienen. Den Broker also nicht ins Internet stellen, das Merkwort nicht weitergeben, und den Zugang zu LoxBerry und Miniserver entsprechend absichern. Die Schnittstelle ist inoffiziell; die Nutzung geschieht auf eigenes Risiko."
WERT = "Wert"
WIRKUNG = "Wirkung"
ZEILE = "Zeile"
ZEILEN_HILFE = "Der Abruf beim Plugin kostet nichts und weckt das <i>Auto</i> nicht — gefragt wird immer nur der Zwischenspeicher. Wie oft das Fahrzeug selbst gefragt wird, bestimmt allein das Gateway."

