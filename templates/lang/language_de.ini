MERKWORT = "Aktuelles Merkwort"
MERKWORT_HINWEIS = "<b>Befehle brauchen dieses Merkwort.</b> Die Adresse <span class='sm-mono'>mg.php</span> liegt im unangemeldeten Bereich, damit Loxone sie ohne Zugangsdaten erreicht — deshalb ist jeder <i>schaltende</i> Aufruf und die Debug-Ansicht durch <span class='sm-mono'>&amp;token=…</span> geschützt. Die Adressen unten enthalten es bereits. <b>Wird ein neues Merkwort erzeugt, sind alle unten stehenden Adressen in Loxone neu zu übernehmen.</b>"
NAME = "Name"
PARAMETER = "Parameter"
S1 = "<b>Hausform ist das MQTT-Gateway V2 mit der Befehlsbrücke</b>: die Werte kommen als einfache „Virtuelle Eingänge“ mit dem Namen, den das Gateway vergibt (Schritt 2), die Befehle gehen über den gemeinsamen Ausgang „LoxBerry MQTT-Gateway“ (Schritt 3) – ohne Merkwort in den Adressen des Miniservers. Der bisherige Weg über HTTP steht eingeklappt weiter unten; wer ihn nutzt, muss nichts ändern."
S1_TITEL = "Schritt 1: Den Weg festlegen"
S2 = "System → MQTT Gateway → Subscriptions:"
S2_TITEL = "Schritt 2: Das Abo im MQTT-Gateway"
S3 = "Vier Zeilen mit eigenem Abfragetakt. Wer alles in einem Eingang haben will, nimmt nur die erste — sie enthält jedes Feld. Die übrigen drei sind kürzer und dürfen deshalb öfter beziehungsweise seltener abgefragt werden."
S3_TITEL = "HTTP 1: Virtuelle HTTP-Eingänge anlegen"
S4 = "Die Vorlage weiter unten legt alle Eingänge auf einmal an. Die Tabelle bleibt trotzdem stehen — sie erklärt, was importiert wird."
S4_TITEL = "HTTP 2: Befehlserkennungen"
S5 = "Die Adresse des Ausgangs ist der Rechnername; der Pfad steht je Befehl in der Spalte <i>Befehl bei EIN</i>. Analoge Befehle tragen <span class='sm-mono'>&lt;v.0&gt;</span>: Loxone setzt dort den Wert des Ausgangs als ganze Zahl ein – das Plugin nimmt Ziel-Ladestand, Ladestrom, Sitzheizung und Abfrageintervalle nur ganzzahlig. „Standklima einschalten“ trägt in der Vorlage seit 1.1.26 keinen Aus-Befehl mehr; ausgeschaltet wird mit dem eigenen Befehl <span class='sm-mono'>klima_aus</span>."
S5_TITEL = "HTTP 3: Virtueller Ausgang für Befehle"
S6 = "Ein virtueller Eingang <b>behält seinen letzten Wert</b>, wenn nichts mehr kommt. Das Lebenszeichen <span class='sm-mono'>mg_status_zaehler</span> zählt bei jedem Minutenlauf des Plugins eins weiter (Noncached anhaken). Prüfen mit einer <b>Analogwertvalidierung</b>: Tmc max(3 × 60 s, 180 s) = <b>180 s</b>, Meldung „Störung bestätigt“ nach 600 s. <span class='sm-mono'>mg_status_ok</span> sagt, ob der letzte Lauf eingelesen hat, <span class='sm-mono'>mg_1_ok</span>, ob die Fahrzeugdaten gültig sind. <b>Nicht auf alter oder fahrzeugalter verdrahten</b>: das Alter wächst, solange das Auto schläft – das allein ist kein Fehler. Im HTTP-Weg übernimmt das Feld ZAEHLER dieselbe Rolle."
S6_TITEL = "Schritt 4: Ausfallerkennung"
S7 = "Vier Seiten, wie sie im LoxBerry-Plugins Musterprojekt fertig verbunden stehen: Überwachung mit Ladestand und Reichweite, Laden, Klima und Befehle, Fahrzeug. Je Seite ein Kasten „So übernehmen Sie diese Seite“, die Tabelle (eine Zeile je Baustein; Loxone Config führt alle in der Baustein-Suche, Taste F5), Hinweise und ein Bild. Keine Leitung geht über eine Seitengrenze; Eingänge, die auf zwei Seiten stehen, sind dort weitere Instanzen. Wer nur überwachen will, übernimmt die erste Seite. <b>Die Listen zeigen den heutigen Stand des Musterprojekts</b> (HTTP-Zeile „Gesamt“); mit dem nächsten Bau des Musterprojekts wechseln sie auf das MQTT-Gateway V2 und die Befehlsbrücke."
S7_TITEL = "Schritt 5: Baustein-Listen aus dem Musterprojekt (vier Seiten)"
S8 = "Beide Adressen im Browser aufrufen. Der Selbsttest schaltet nichts und rührt das Fahrzeug nicht an — er beantwortet nur die Frage, ob das Merkwort stimmt."
S8_TITEL = "Schritt 6: Gegenprobe"
TAKT = "Abfragezyklus"
TOKEN_NEU_HILFE = "Ein neues Merkwort macht <b>alle</b> oben stehenden Adressen ungültig. Danach liefert der Endpunkt für die alten Adressen HTTP 403 — und ein virtueller Ausgang wertet die Antwort nicht aus, der Ausfall bliebe still. Nur drücken, wenn das bisherige Merkwort in fremde Hände geraten sein könnte."
VORLAGE_FAHRZEUG = "Welches Fahrzeug"
VORLAGE_TEXT = "Die Vorlagen legen alle virtuellen Eingänge beziehungsweise Ausgänge samt Titel, Kommentar, Einheit und Grenzen an. In Loxone Config über <i>Datei → Vorlage einlesen</i>. <b>Loxone Config legt beim Import neu an und überschreibt nichts — zweimal eingelesen ergibt doppelte Bausteine.</b> Die Adresse im Kopf ist ein Vorschlag; bitte prüfen, ob der Miniserver den LoxBerry unter diesem Namen erreicht."
VORLAGE_ZEILE = "Welche Zeile"
WANN = "Wann"
WARNUNG_DATEN = "<b>Was hier über MQTT läuft, ist mehr als eine Zahl.</b> Die Themen tragen den Standort des Fahrzeugs, und über die Befehle lassen sich Klima, Laden und — sofern freigegeben — Licht, Hupe und die Verriegelung schalten. Wer Zugriff auf den Broker oder auf das Merkwort bekommt, kann das Auto orten und bedienen. Den Broker also nicht ins Internet stellen, das Merkwort nicht weitergeben, und den Zugang zu LoxBerry und Miniserver entsprechend absichern. Die Schnittstelle ist inoffiziell; die Nutzung geschieht auf eigenes Risiko."
WERT = "Wert"
WIRKUNG = "Wirkung"
ZEILE = "Zeile"
ZEILEN_HILFE = "Der Abruf beim Plugin kostet nichts und weckt das <i>Auto</i> nicht — gefragt wird immer nur der Zwischenspeicher. Wie oft das Fahrzeug selbst gefragt wird, bestimmt allein das Gateway."
ABO_ROH_WARNUNG = "<b>Rohthemen nur mit Bedacht:</b> Über das MQTT-Gateway V1 wird jedes einzelne Gateway-Thema ein eigener HTTP-Aufruf an den Miniserver, bei mehreren hundert Themen je Fahrzeug eine spürbare Last. Der Regelweg ist das eigene Präfix darüber."
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
BILD_ALT = "Bausteine der Seite „%s“ in Loxone Config"
BILD_UNTERSCHRIFT = "Seite „%s“ im LoxBerry-Plugins Musterprojekt. Config kürzt lange Bausteinnamen – Namen siehe Tabelle."
MUSTERPROJEKT = "Die ganze Projektdatei mit allen Plugin-Seiten und Vorlagen: <a href='https://github.com/timanders22/LoxBerry-Plugins-Musterprojekt' target='_blank' rel='noopener'>LoxBerry-Plugins Musterprojekt</a>"
S7_MEHRERE = "Es sind <b>%d Fahrzeuge</b> eingetragen. Die Namen in den Tabellen gelten für Fahrzeug 1. Für jedes weitere tritt dessen Nummer ein – Eingänge MG2_…, Befehle „MG2 …“, Behälter mit dessen Namen –, genau wie in der Vorlage, die der Abschnitt „Alles auf einmal anlegen“ mit „Welches Fahrzeug“ erzeugt. Die Seiten werden je Fahrzeug einmal nachgebaut."
V2_TITEL = "Schritt 2: Werte über das MQTT-Gateway V2"
V2_ANHAKEN = "<b>Diese Datenpunkte im MQTT-Gateway V2 anhaken</b> (System → MQTT Gateway → Subscriptions). Je Datenpunkt einen „Virtuellen Eingang“ mit genau dem Namen der ersten Spalte anlegen. Die mit Noncached = ja auch so anhaken – sonst reicht das Gateway einen gleichen Wert nicht weiter. Textthemen (Name, Kennung, Klimatext …) gehören nicht hinein."
V2_HILFE = "Der Reiter Test zählt nach, ob alle angehakt sind. Lebenszeichen: <span class='sm-mono'>mg_status_zaehler</span> (siehe Ausfallerkennung)."
V2_NAME = "Name (Virtueller Eingang)"
