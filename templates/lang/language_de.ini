[GW]
H_WARUM = "Warum ein zusätzlicher Container"
S1 = "Dafür gibt es ein fertiges Plugin: <b>Docker</b> von Michael Miklis. Es installiert Docker und <b>Portainer</b>, eine Oberfläche, in der sich Container anlegen lassen. Ohne dieses Plugin geht es auch — dann per SSH."
S1_TITEL = "Schritt 1: Docker auf den LoxBerry"
S2 = "Das MQTT-Gateway des LoxBerry muss laufen (System &rarr; MQTT Gateway), und ein iSMART-Konto mit registriertem Fahrzeug wird gebraucht. Das iSMART-Passwort kennt <b>nur der Container</b> — dieses Plugin braucht es nicht."
S2_TITEL = "Schritt 2: Weitere Voraussetzungen"
S3 = "Entweder in Portainer über <i>Add container</i> oder am LoxBerry per SSH:"
S3_HINWEIS = "Verlangt der Broker eine Anmeldung, zusätzlich <span class='sm-mono'>-e MQTT_USER</span> und <span class='sm-mono'>-e MQTT_PASSWORD</span> angeben. Die Zeile <span class='sm-mono'>HA_DISCOVERY_ENABLED=False</span> spart die Home-Assistant-Themen, die hier niemand braucht."
S3_TITEL = "Schritt 3: Container anlegen"
S4 = "<span class='sm-mono'>docker logs -f saic-gateway</span> zeigt den Anmeldevorgang. Danach im Reiter <b>Test</b> auf <i>Werte jetzt einlesen</i> klicken — dort steht auch die Fahrzeug-Kennung."
S4_TITEL = "Schritt 4: Kontrolle"
S5_HINWEIS = "Zwei weitere Eigenheiten: <b>Laden starten</b> gilt als unzuverlässig, während <i>Laden stoppen</i> zuverlässig funktioniert — die Ladestrombegrenzung wirkt dagegen gut. Und meldet sich die iSMART-App an, pausiert das Gateway rund 15 Minuten."
S5_TITEL = "Schritt 5: Abfrageintervalle bitte in Ruhe lassen"
S5_WARNUNG = "<b>Das Abfragen weckt die Fahrzeugelektronik.</b> Die Entwickler des Gateways warnen ausdrücklich vor einer leergesaugten <b>12-Volt-Batterie</b>. Das Ruheintervall (Vorgabe: einmal täglich) sollte man nicht verkürzen. Der richtige Weg ist gezielt statt dauernd: <span class='sm-mono'>?cmd=auffrischen</span>."
WARUM = "MG/SAIC bietet keine offene Schnittstelle an; die App spricht über ein verschlüsseltes, tokenbasiertes Protokoll mit den Servern. Das quelloffene <b>SAIC MQTT Gateway</b> bildet dieses Protokoll nach und veröffentlicht die Fahrzeugdaten per MQTT. Eine Neuimplementierung in PHP wäre aufwendig und würde bei jeder Änderung der Gegenstelle brechen."

