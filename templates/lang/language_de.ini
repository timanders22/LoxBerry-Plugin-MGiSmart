CHECK_HILFE = "Das <b>Semikolon im Suchtext ist kein Zierrat</b>: ohne es träfe <span class='sm-mono'>\iKM=</span> in einer Zeile, die auch <span class='sm-mono'>KMTAG=</span> enthält, unter Umständen die falsche Fundstelle — Loxone nimmt die erste. Nicht jedes Modell liefert jeden Wert; fehlt einer, steht <span class='sm-mono'>-1</span> (bei Temperaturen <span class='sm-mono'>-99</span>). In Loxone also nicht blind weiterrechnen, sondern vorher auf <span class='sm-mono'>größer gleich 0</span> prüfen; die Vorlage setzt dafür <span class='sm-mono'>MinVal</span> passend, sodass der Fehlwert wirklich negativ ankommt."
