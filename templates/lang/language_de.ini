SEITE1_SCHRITT1 = "Im Plugin Reiter „Gateway einrichten“ die iSMART-E-Mail und das Kennwort eintragen, „Gateway anlegen und starten“; die Ampel muss „Container läuft“, „Anmeldung bei MG“ und „Werte kommen“ zeigen. Im Reiter „MQTT“ das Fahrzeug eintragen. Für Standort-Aussagen im Reiter „Einstellungen“ die Heimzone (Breite, Länge, Radius) eintragen. Reiter „Test“ → „Loxone-Zeile abrufen“: es kommt MG;OK=1;… mit Zahlen."
SEITE1_SCHRITT2 = "Dieser Reiter, Abschnitt „Alles auf einmal anlegen“: Zeile „Gesamt“, Fahrzeug 1 → „Vorlage für Loxone Config erzeugen“, dazu „Vorlage der Steuerbefehle erzeugen“. In Loxone Config: Peripherie → Virtuelle Eingänge → Vorlage importieren (Behälter „MG 1 (Gesamt)“), Peripherie → Virtuelle Ausgänge → Vorlage importieren („MG 1 (Steuerbefehle)“). Jede nur EINMAL einlesen (zweimal ergibt doppelte Bausteine). Die Zeilen „Laden“, „Ort und Fahrt“, „Technik“ werden nicht gebraucht."
SEITE1_SCHRITT3 = "Seite „MGiSmart“ anlegen, die 14 Befehle aus „MG 1 (Gesamt)“ ziehen (Nr. 1–14), dazu die Konstante 1."
SEITE1_SCHRITT4 = "Drei Benachrichtigungen anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Liste."
SEITE1_SCHRITT5 = "Übrige Bausteine über die Baustein-Suche (F5), Parameter wie in der Liste, von oben nach unten verbinden. Analogwertvalidierung Nr. 16: Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). UND Nr. 27: Eingang I2 negieren – in Config auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. Flankenerkennung Nr. 32: Ausgang Off benutzen. Status „Zustand (MG)“ und „Ladestand und Reichweite (MG)“ je viermal „+“; Zeilen in der angegebenen Reihenfolge, die ohne Bedingung zuletzt. An MG_SOC und MG_REICHWEITE im Eigenschaftsfenster „Statistik“ einschalten."
SEITE1_SCHRITT6 = "Speichern und übertragen. Probe: „Zustand (MG)“ zeigt „läuft – letzte Fahrzeugabfrage vor … min“; MG_ZAEHLER zählt alle 5 Minuten um 5 weiter."
SEITE1_H1 = "Die Störmeldung kommt nach 10 Minuten ohne gültige Daten; einen stehenden LoxBerry erkennt die Seite nach etwa 25 Minuten (15 Minuten ohne neuen Zählerstand plus 10 Minuten Bestätigung)."
SEITE1_H2 = "Zu Nr. 2 und 16: steht der LoxBerry, behalten alle Eingänge ihren letzten Wert; nur der stehende Laufzähler verrät es. ALTER und FZALTER taugen dafür nicht (ALTER steht im Normalbetrieb auf 0, FZALTER beim Laden)."
SEITE1_H3 = "Ein schlafendes Auto ist kein Fehler des Plugins. Meldet das Gateway das Fahrzeug aber als „nicht erreicht“, steht OK auf 0 und die Störmeldung kommt ebenfalls – der Status nennt dann „Gateway erreicht das Fahrzeug nicht“."
SEITE1_H4 = "Zu Nr. 22/24: -1 heißt „nicht gemeldet“ und darf nicht als „niedrig“ zählen. Zu Nr. 23/25: ein Schwellwertschalter hinter einem abgefragten Eingang gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung Nr. 28 vor der Meldung schluckt ihn."
SEITE1_H5 = "Zweites Fahrzeug: in diesem Reiter die Vorlagen für Fahrzeug 2 holen (Namen MG2_…, Behälter „MG 2 (Gesamt)“ bzw. „MG 2 (Steuerbefehle)“) und die vier Seiten mit diesen Namen kopieren; die Störung des zweiten Autos über ein weiteres ODER vor Nr. 19 führen."
SEITE1_H6 = "Nach „Neues Merkwort erzeugen“ im Plugin die Befehlsvorlage neu holen und die Ausgänge neu verbinden (die Adressen tragen das Merkwort); die Eingangsvorlage braucht kein Merkwort."
SEITE1_H7 = "Die plugin-eigenen Meldungen (geladen, Kabel, unverschlossen, Fenster, Befehl gescheitert) nutzt das Muster nicht – sie würden die Seiten doppeln. Wer nur sie will, hängt eine Benachrichtigung an MG_PUSHAKTIV."
SEITE2_SCHRITT1 = "Behälter aus Seite „MGiSmart“, Schritt 2 (nicht erneut importieren). „Steuerbefehle erlauben“ ist im Plugin ab Werk an."
SEITE2_SCHRITT2 = "Neue Seite, die 17 Befehle aus „MG 1 (Gesamt)“ ziehen (MG_LAEDT, MG_STECKER, MG_SOC, MG_RESTZEIT ein weiteres Mal), spot_awattar_rank (Virtuellen Eingang mit dem Namen aus der Namenstabelle im Reiter ‚Einbindung in Loxone‘ des Plugins Spotpreis aWATTar, ab 1.2.38, anlegen) und die vier Virtuellen Ausgang Befehle aus „MG 1 (Steuerbefehle)“ (Ziel-Ladestand, Ladestromgrenze, Batterieheizung, Laden starten)."
SEITE2_SCHRITT3 = "Schieberegler „Ladegrenze (MG) (Proz)“, „Ladestrom (MG) (A)“ und die Schalter „Batterieheizung (MG)“, „Laden nach Empfehlung (MG)“, „Laden von Hand (MG)“ anlegen (Peripherie → Virtuelle Eingänge), Werte wie in der Liste."
SEITE2_SCHRITT4 = "Übrige Bausteine über F5; bei „Größer“ und „Kleiner oder gleich“ den zweiten Eingang offen lassen und V2 im Eigenschaftsfenster setzen. „+“: „Laden (MG)“ und „Ladetechnik (MG)“ je viermal. „Statistik“ an MG_ACLEISTUNG."
SEITE2_SCHRITT5 = "Speichern und übertragen. Probe: Kabel einstecken – „Laden (MG)“ zeigt nach dem nächsten Abruf (bis 5 Minuten) „Kabel steckt, lädt nicht“ oder „lädt mit … kW“; den Ziel-Ladestand auf 70 Prozent stellen – nach der nächsten Fahrzeugabfrage steht 70 im Status."
SEITE2_H1 = "„Laden nach Empfehlung“ lädt in den vier günstigsten Stunden laut Spotpreis-Plugin, nur zu Hause; die günstige Stunde kommt aus dem Spotpreis-Plugin, Loxone entscheidet (Nr. 26–33). Ohne Spotpreis-Plugin bleibt spot_awattar_rank frei (dann nie günstig). Mit EVCC an der Wallbox diesen Schalter AUS lassen – dort regelt EVCC (Seiten „EVCC …“); ebenso die plugin-eigene Ladeempfehlung (Reiter Einstellungen) aus lassen: zwei Regler am selben Auto arbeiten gegeneinander."
SEITE2_H2 = "„Laden starten“ gilt im Gateway-Projekt als unzuverlässig; „Laden stoppen“ wirkt sicher. Wer die Ladung sicher freigeben will, steuert die Wallbox (Seiten „EVCC …“) und lässt das Auto auf Dauer ladebereit."
SEITE2_H3 = "Schieberegler in der App loslassen statt ziehen: jeder neue Wert ist ein Befehl; das Plugin lässt höchstens 30 je Stunde durch, die Ladestromgrenze nur alle 5 Minuten."
SEITE2_H4 = "Ladestrom: das Muster kennt nur 6 und 16 A. Das Plugin nimmt auch 8 A und MAX (32) an; wer sie braucht, stellt den Regler auf Min 6, Max 32 und wählt die Stufen von Hand."
SEITE2_H5 = "An einer Gleichstromsäule nicht nach Überschuss regeln – „Ladetechnik (MG)“ sagt, wenn beide Stecker erkannt sind und kein Wechselstrom fließt."
SEITE3_SCHRITT1 = "Behälter wie auf Seite „MGiSmart“, Schritt 2."
SEITE3_SCHRITT2 = "Neue Seite, die 9 Befehle aus „MG 1 (Gesamt)“ und die 11 Virtuellen Ausgang Befehle der Liste ziehen; „Anwesenheit (eigene Quelle)“ aus dem Baum ziehen bzw. einmal als Virtuellen Eingang anlegen und aus der eigenen Anwesenheit speisen."
SEITE3_SCHRITT3 = "Drei Schieberegler (Zieltemperatur, Sitzheizung links und rechts), zwei Schalter (Heck- und Frontscheibenheizung) und fünf Tasten (Klima jetzt, Klima aus, Klima nur vorn, Nur lüften, Jetzt abrufen) anlegen."
SEITE3_SCHRITT4 = "Schaltuhr „Abfahrt vorklimatisieren (MG)“ über F5 setzen und die eigenen Abfahrtstage eintragen: Beginn 20 Minuten vor der Abfahrt, Ende zur Abfahrt; ihren Ausgang AQ an das UND Nr. 17. Übrige Bausteine über F5. „+“: „Klima (MG)“ viermal."
SEITE3_SCHRITT5 = "Speichern und übertragen. Probe: „Klima jetzt“ drücken – nach der nächsten Fahrzeugabfrage zeigt „Klima (MG)“ „Standklima läuft – Ziel … °C“; „Klima aus“ schaltet es ab."
SEITE3_H1 = "Zu Nr. 13/19: die Temperatur ist ein eigener Befehl und gilt für das nächste Einschalten; der Einschaltbefehl selbst trägt keine Temperatur. Erst den Regler stellen, dann „Klima jetzt“. „Standklima einschalten“ hat keinen Aus-Befehl (sonst schaltete das Loslassen der Taste bzw. das Ende der Schaltuhr das Klima sofort wieder ab) – „Klima aus“ ist ein eigener Befehl."
SEITE3_H2 = "Wer im Plugin die eigene Vorklimatisierung (Abfahrts-Assistent, Reiter Einstellungen) nutzt, lässt die Schaltuhr Nr. 15 weg – sonst fordern zwei Wege an."
SEITE3_H3 = "„Auto finden“, Ver- und Entriegeln und der Kofferraum fehlen bewusst: sie brauchen im Plugin den zweiten Haken und gehören nicht auf eine App-Taste. Lade- und Batterieheizplan (dritter Haken) sind am Fahrzeug nicht erprobt und fehlen ebenso."
SEITE3_H4 = "Abfragemodus und Abfrageintervalle des Gateways stehen in der Befehlsvorlage, sind aber nicht verdrahtet; einstellen im Plugin."
SEITE3_H5 = "„Jetzt abrufen“ weckt das Fahrzeug; nicht in einen Takt hängen."
SEITE4_SCHRITT1 = "Behälter wie auf Seite „MGiSmart“, Schritt 2."
SEITE4_SCHRITT2 = "Neue Seite, die 19 Befehle ziehen (MG_LAEUFT, MG_OK, MG_ZUHAUSE ein weiteres Mal); „Statistik“ an MG_KM."
SEITE4_SCHRITT3 = "Zwei Benachrichtigungen anlegen: „Meldung Fahrzeug offen (MG)“, „Meldung Reifendruck niedrig (MG)“."
SEITE4_SCHRITT4 = "Übrige Bausteine über F5; bei den beiden „Größer“ den zweiten Eingang offen lassen, V2 = 0. „+“: „Türen und Fenster (MG)“ zweimal, „Standort und Fahrt (MG)“ viermal, „Reifen und 12-V-Batterie (MG)“ zweimal."
SEITE4_SCHRITT5 = "Speichern und übertragen. Probe: Auto abgestellt unverschlossen lassen – nach der nächsten Fahrzeugabfrage und 5 Minuten kommt die Meldung."
SEITE4_H1 = "Die Offen-Meldung gilt nur für ein abgestelltes Auto mit gültigen Daten (Nr. 26/27: während der Fahrt ist das Auto nicht verschlossen – ohne diese Bedingung käme bei jeder Fahrt „offen“); bei einer Störung schweigt sie."
SEITE4_H2 = "Zu Nr. 30: -1 heißt „nicht gemeldet“ und zählt nicht als niedrig. Zu Nr. 31: der Schwellwertschalter gibt bei jeder Abfrage einen kurzen Impuls; die Einschaltverzögerung Nr. 32 schluckt ihn."
SEITE4_H3 = "Türen und Fenster kommen als Anzahl; welche offen sind, steht nur in der MQTT-Veröffentlichung des Plugins (Reiter MQTT)."
SEITE4_H4 = "Ohne Heimzone im Plugin bleiben „zu Hause“ und die Entfernung leer; der Status sagt es. Die Rohkoordinaten gehen bewusst nicht nach Loxone."
SEITE4_H5 = "Tagesstrecke und Tagesverbrauch zählt das Fahrzeug selbst – kein Impuls um 0:00 nötig."
