; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "MG iSmart"
K02 = "Bringt die Daten eines <b>MG-Elektrofahrzeugs</b> (iSMART / SAIC) nach Loxone — Ladestand, Reichweite, Ladeleistung, Türen, Klima, Standort — und schickt Befehle zurück: Laden stoppen, Ziel-Ladestand, Ladestrombegrenzung, Standklima, „Auto finden“."
K03 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K04 = "Wie es funktioniert"
K05 = "MG/SAIC bietet keine offene Schnittstelle an; die App spricht über ein verschlüsseltes, tokenbasiertes Protokoll mit den Servern. Das quelloffene Projekt <a href='https://github.com/SAIC-iSmart-API/saic-python-mqtt-gateway' target='_blank'>SAIC MQTT Gateway</a> bildet dieses Protokoll nach und veröffentlicht die Fahrzeugdaten per MQTT."
K06 = "Dieses Plugin setzt darauf auf:"
K07 = "Eine Neuimplementierung der SAIC-API in PHP wäre aufwendig und würde bei jeder Änderung der Gegenstelle brechen. Der Reiter <b>Gateway einrichten</b> enthält den kompletten <code>docker run</code>-Befehl und die Stolperfallen."
K08 = "Funktionen"
K09 = "<b>Loxone-Zeile</b> mit Ladestand (% und kWh), Ziel-SoC, Reichweite, Ladestatus, Stecker, Ladeleistung, Restladezeit, Kilometerstand, 12-V-Spannung, Verriegelung, Innen-/Außentemperatur"
K10 = "<b>Steuerbefehle</b> aus einer festen, geprüften Liste — nichts anderes nimmt der Endpunkt an: Laden stoppen/starten, Ziel-SoC 60–100 %, Ladestrom 6/8/16 A/MAX, Standklima, Heckscheibenheizung, Auto finden, Status jetzt abfragen"
K11 = "<b>Meldungen</b> für Loxone: Ziel-Ladestand erreicht, Kabel ein-/ausgesteckt, Auto steht unverschlossen — als <code>PUSHAKTIV=1</code> für ein einstellbares Fenster"
K12 = "<b>Robuste Zuordnung</b>: Das Plugin sucht jeden Wert über mehrere mögliche Themennamen. Liefert ein Modell etwas nicht, kommt <code>-1</code> statt eines Fehlers"
K13 = "<b>Debug-Ansicht</b> mit allen empfangenen MQTT-Themen — dort steht auch die Fahrzeug-ID"
K14 = "Reiter: Einstellungen, Gateway einrichten, Einbindung in Loxone (inkl. kompletter Baustein-Liste), Test, Protokoll"
K15 = "Endpunkte"
K16 = "Wichtige Hinweise"
K17 = "<b>12-Volt-Batterie:</b> Das Abfragen weckt die Fahrzeugelektronik. Das Ruheintervall des Gateways (Standard: einmal täglich) sollte man nicht verkürzen. Für frische Werte gezielt <code>?cmd=auffrischen</code> verwenden."
K18 = "<b>Nur eine Sitzung:</b> Meldet sich die iSMART-App an, pausiert das Gateway rund 15 Minuten."
K19 = "<b>„Laden starten“ ist unzuverlässig</b>, „Laden stoppen“ funktioniert gut. Wer über die Wallbox schaltet, ist auf der sicheren Seite; die Ladestrombegrenzung des Autos wirkt dagegen zuverlässig."
K20 = "Die Schnittstelle ist <b>inoffiziell</b> und kann sich jederzeit ändern."
K21 = "Voraussetzungen"
K22 = "LoxBerry-Plugin <b>Docker</b> (für den Gateway-Container)"
K23 = "Paket <b>mosquitto-clients</b> (wird bei der Installation mitinstalliert)"
K24 = "iSMART-Konto mit registriertem Fahrzeug"
K25 = "Datenschutz"
K26 = "Das <b>iSMART-Passwort kennt nur der Gateway-Container</b> — dieses Plugin braucht es nicht. Broker-Zugangsdaten liegen in <code>config/plugins/mgismart/mg.json</code>, die Datei wird auf <code>chmod 600</code> gesetzt. Passwörter werden im Protokoll maskiert. Im Plugin sind <b>keine persönlichen Daten</b> enthalten."
K27 = "Aufruf"
K28 = "Zweck"
K29 = "<code>/plugins/mgismart/mg.php</code>"
K30 = "Loxone-Zeile <code>MG;OK=..;SOC=..;ZIEL=..;LAEDT=..;…</code>"
K31 = "<code>/plugins/mgismart/mg.php?cmd=ziel_80</code>"
K32 = "Befehl ans Fahrzeug"
K33 = "<code>/plugins/mgismart/mg.php?json=1</code>"
K34 = "Zustand als JSON"
K35 = "<code>/plugins/mgismart/mg.php?debug=1</code>"
K36 = "alle empfangenen MQTT-Themen"
K37 = "<code>/plugins/mgismart/mg.php?refresh=1</code>"
K38 = "Werte sofort neu einlesen"
K39 = "<code>/plugins/mgismart/mg.php?ptest=1</code>"
K40 = "Test-Pushnachricht auslösen"
