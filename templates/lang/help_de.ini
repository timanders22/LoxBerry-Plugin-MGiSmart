; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
; Erzeugt aus derselben Tabelle wie help.html und help_en.ini.

[HILFE]
K01 = "MG iSmart"
K02 = "Dieses Plugin bringt die Daten eines oder mehrerer MG-Elektrofahrzeuge nach Loxone und schickt Befehle zurueck."
K03 = "Es spricht nicht selbst mit MG, sondern liest die Werte von einem MQTT-Broker. Dort veroeffentlicht sie das quelloffene SAIC MQTT Gateway, ein Docker-Container."
K04 = "Der Weg der Daten"
K05 = "Fahrzeug - iSMART-Server - SAIC-MQTT-Gateway (Docker) - MQTT-Broker - dieses Plugin - Loxone"
K06 = "Das iSMART-Kennwort braucht nur der Gateway-Container. Das Plugin verwahrt es in seiner Konfiguration (Rechte 0600), um den Container anlegen zu koennen, und gibt es nie aus."
K07 = "Die Reiter der Reihe nach"
K08 = "<b>Einstellungen</b> - Steuerung, Drosselung, Heimzone, Benachrichtigungen und die beiden Automatiken."
K09 = "<b>MQTT</b> - alles, was mit Themen zu tun hat: Broker-Zugang (ab Werk der des LoxBerry), Themen-Praefix, iSMART-Benutzername, die Fahrzeuge und die eigene Veroeffentlichung. Dort steht auch die Tabelle aller Themen, die das Plugin selbst sendet."
K10 = "<b>Gateway einrichten</b> - iSMART-E-Mail und -Kennwort eintragen; das Plugin legt den Gateway-Container selbst an und zeigt seinen Zustand als Ampel."
K11 = "<b>Einbindung in Loxone</b> - acht Schritte, die komplette Baustein-Liste und die beiden Vorlagen fuer Loxone Config."
K12 = "<b>Ladungen</b> - die mitgeschriebenen Ladevorgaenge mit Dauer, kWh und Verbrauch je 100 km."
K13 = "<b>Test</b> - die Selbstpruefung. Sie beantwortet ohne Loxone, ob die Einrichtung traegt. Ein Strich ist dabei kein Haken, sondern heisst: nicht feststellbar."
K14 = "<b>Logdateien</b> - Zustandsaenderungen, Befehle und Fehler. Passwort und Merkwort erscheinen maskiert."
K15 = "Die Endpunkte"
K16 = "Aufruf"
K17 = "Zweck"
K18 = "mg.php"
K19 = "die vollstaendige Loxone-Zeile"
K20 = "mg.php?zeile=laden"
K21 = "nur die Ladewerte, eigener Abfragetakt"
K22 = "mg.php?fahrzeug=2"
K23 = "das zweite eingerichtete Fahrzeug"
K24 = "mg.php?json=1"
K25 = "der Zustand als JSON"
K26 = "mg.php?cmd=ziel&amp;prozent=80&amp;token=T"
K27 = "Befehl ans Fahrzeug"
K28 = "mg.php?selftest=1&amp;token=T"
K29 = "nur pruefen, ob das Merkwort stimmt"
K30 = "Warum manche Aufrufe ein Merkwort brauchen"
K31 = "mg.php liegt im unangemeldeten Bereich, damit Loxone es ohne Zugangsdaten erreicht. Jeder Aufruf, der etwas ausloest, ist deshalb durch ein Merkwort geschuetzt - und seit 1.1.0 auch die Debug-Ansicht: dort stehen der iSMART-Benutzername, die Fahrzeug-Kennung und die Standortthemen."
K32 = "Wird ein neues Merkwort erzeugt, sind alle in Loxone eingetragenen Adressen neu zu uebernehmen. Ein virtueller Ausgang wertet die Antwort nicht aus - der Ausfall bliebe sonst still."
K33 = "Die 12-Volt-Batterie"
K34 = "Jede Abfrage und jeder Befehl weckt die Fahrzeugelektronik. Die Entwickler des Gateways warnen ausdruecklich vor einer leergesaugten 12-Volt-Batterie. Das Plugin drosselt deshalb: Mindestabstand je Befehl, Obergrenze je Stunde, und ein Befehl, dessen Zielzustand schon anliegt, wird gar nicht erst gesendet."
K35 = "Was ein Wert von minus eins bedeutet"
K36 = "Nicht jedes Modell liefert jeden Wert. Fehlt einer, sendet das Plugin -1, bei Temperaturen -99. Das ist kein Messwert, sondern die Aussage nicht bekannt. Die Vorlage fuer Loxone Config setzt MinVal passend, damit der Fehlwert wirklich negativ ankommt und sich von einer echten Null unterscheiden laesst."
K37 = "Ladeplan: belegt, aber nicht erprobt"
K38 = "Der Ladeplan und der Batterieheizplan stehen hinter einem eigenen Haken, und der ist ab Werk aus. Die Gestalt der Nachricht ist belegt - sie stammt aus dem Quelltext des Gateways, nicht aus einer Vermutung. Ob das Fahrzeug den Plan annimmt, ist an keinem Auto geprueft worden, und das kann keine Quelle beantworten. Diese Befehle melden deshalb OK=2, also abgesetzt mit unbekanntem Ergebnis, statt einen Erfolg zu behaupten."
K39 = "Es gibt ein zweites Plugin fuer dasselbe Auto"
K40 = "Das Plugin von Michael Schlenstedt installiert und betreibt das Gateway ebenfalls selbst. Beide beanspruchen den Ordnernamen mgismart; LoxBerry haengt beim zweiten eine Nummer an. Jedes legt nur seinen eigenen Container an, erkennbar am Label mit dem Ordnernamen, und fasst den des anderen nicht an. Und das MQTT-Gateway kennt zwei Fassungen: V1 verlangt das Abo von Hand, V2 erkennt die Themengruppe selbst. Der Reiter Einbindung in Loxone liest die Fassung aus der general.json und zeigt den passenden Satz."
K41 = "Lizenz"
K42 = "MIT."
K43 = "Der Gateway-Container"
K44 = "Das Plugin legt einen Container namens lb-&lt;Ordner&gt;-saic-gateway aus dem Abbild saicismartapi/saic-python-mqtt-gateway an, mit --network host und --restart unless-stopped. Er traegt die Labels de.loxberry.plugin.folder, .name, .def und .brokerhash. Uebergeben werden iSMART-E-Mail und -Kennwort, Broker-Adresse, -Benutzer und -Kennwort, das Themen-Praefix und die Akkugroesse je Fahrzeug - ueber eine Umgebungsdatei (Rechte 0600), die gleich danach geloescht wird, nie ueber eine Befehlszeile. Die Adresse des iSMART-Servers und die Region setzt das Plugin nicht; es gilt die Vorgabe des Gateways."
K45 = "Jeder Eingriff - Neustart, Entfernen, Protokoll - trifft nur einen Container mit den eigenen Labels. Wer das Gateway zusaetzlich von Hand betreibt, tut das ohne diese Labels; das Plugin fasst einen solchen Container nie an, und einer gleichen Namens verhindert nur das Anlegen. Kein Takt und kein Installationsschritt startet, stoppt oder entfernt den Container; nur die Deinstallation entfernt den eigenen, das Abbild bleibt."
K46 = "Zu wissen: docker inspect zeigt die Umgebungsvariablen des Containers samt Kennwoertern im Klartext, und jeder in der Gruppe docker darf das aufrufen. Wird das Broker-Kennwort im LoxBerry geaendert, kennt der Container noch das alte - die Ampel zeigt dann gelb, und das Gateway ist neu anzulegen."
K47 = "Der Broker-Zugang"
K48 = "Ab Werk nimmt das Plugin Adresse, Port, Benutzer und Kennwort des Brokers aus der LoxBerry-Konfiguration (System - MQTT Gateway); der Reiter MQTT zeigt, woher sie kommen. Eigene Angaben gelten nur hinter dem Haken Eigene Broker-Angaben verwenden: mit Benutzer, oder ohne Anmeldung fuer einen Broker auf einem anderen Rechner. Ein Kennwort erscheint nie auf der Seite. Weist der Broker die Anmeldung ab, ist er nicht erreichbar oder liegt unter dem Praefix nichts, sagt das der Reiter Test mit einem eigenen Satz."
K49 = "Wann OK=1 gilt"
K50 = "OK ist 1, wenn die Momentaufnahme hoechstens 3 Minuten alt ist (das Dreifache des Takts) und das Gateway sich nicht per Letztem Willen offline gemeldet hat - in allen Zeilen, auch laden und ort."
K51 = "Anmeldung bei MG"
K52 = "Das Gateway meldet unter account/lastLogin die letzte gelungene und unter account/lastLoginError die letzte gescheiterte Anmeldung bei MG. Ist der Fehler juenger als die Anmeldung oder gibt es nur den Fehler, zeigt die Ampel im Reiter Gateway einrichten rot: Anmeldung bei MG gescheitert, mit Zeitpunkt und Text. Dann iSMART-E-Mail und -Kennwort pruefen (am sichersten in der iSMART-App) und das Gateway neu anlegen. Fehlen beide Themen oder lassen sie sich nicht lesen, heisst das unbekannt, nicht in Ordnung; die Ampel zeigt dann grau. Ueber MQTT geht der Zustand bei jedem Takt als &lt;Praefix&gt;/gateway/anmeldung hinaus (1 in Ordnung, 0 gescheitert, - unbekannt), nicht retained wie ok, denn es ist eine Aussage des Gateways ueber sich selbst; im JSON des Endpunkts steht er als _gateway_anmeldung. Die Frage, ob das Gateway jedes Fahrzeug zuletzt erreicht hat, ist davon getrennt."
K53 = "Healthcheck des LoxBerry"
K54 = "Das Plugin meldet sich beim Healthcheck des LoxBerry (bin/healthcheck) mit fuenf Punkten: laeuft der Takt, nimmt der Broker die Anmeldung an, laeuft der Gateway-Container (nur, wenn das Plugin ihn eingerichtet hat), ist die Anmeldung bei MG gelungen, und sind die Werte hoechstens 3 Minuten alt. Geurteilt wird ueber das Alter der Werte, nicht ueber einen einzelnen Abruf. Docker und der Broker werden nur mit kurzer Zeitgrenze gefragt; geschrieben wird nichts. Ein Befehl, den das Fahrzeug nicht angenommen hat (etwa Rueckgabe 4, das Fahrzeug schlaeft), ist nur ein Hinweis, kein Fehler. Dieselben Punkte stehen im Reiter Test."
K55 = "Gateway-Abbild aktualisieren"
K56 = "Der Knopf im Reiter Gateway einrichten holt das Abbild neu (docker pull, im Hintergrund, hoechstens 15 Minuten). Laeuft der eigene Container schon mit diesem Abbild, bleibt alles, wie es ist. Sonst haelt das Plugin nur den eigenen Container an (erkennbar am Label des Plugins), entfernt ihn und legt ihn mit denselben Einstellungen neu an. Scheitert das, nennt der Reiter den Grund; Zugangsdaten und Einstellungen bleiben gespeichert, und Gateway anlegen und starten richtet ihn wieder ein. Die Ampel zeigt die Fassung, die das Gateway unter account/gatewayVersion meldet, dazu Abbild und Digest des laufenden Containers. Von selbst wird nie aktualisiert."
