; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
; Erzeugt aus derselben Tabelle wie help.html und help_en.ini.

[HILFE]
K01 = "MG iSmart"
K02 = "Dieses Plugin bringt die Daten eines oder mehrerer MG-Elektrofahrzeuge nach Loxone und schickt Befehle zurück."
K03 = "Es spricht nicht selbst mit MG, sondern liest die Werte von einem MQTT-Broker. Dort veröffentlicht sie das quelloffene SAIC MQTT Gateway, ein Docker-Container."
K04 = "Der Weg der Daten"
K05 = "Fahrzeug - iSMART-Server - SAIC-MQTT-Gateway (Docker) - MQTT-Broker - dieses Plugin - Loxone"
K06 = "Das iSMART-Kennwort braucht nur der Gateway-Container. Das Plugin verwahrt es in seiner Konfiguration (Rechte 0600), um den Container anlegen zu können, und gibt es nie aus."
K07 = "Die Reiter der Reihe nach"
K08 = "<b>Einstellungen</b> - Steuerung, Drosselung, Heimzone, Benachrichtigungen und die beiden Automatiken."
K09 = "<b>MQTT</b> - alles, was mit Themen zu tun hat: Broker-Zugang (ab Werk der des LoxBerry), Themen-Präfix, iSMART-Benutzername, die Fahrzeuge und die eigene Veröffentlichung. Dort steht auch die Tabelle aller Themen, die das Plugin selbst sendet."
K10 = "<b>Gateway einrichten</b> - iSMART-E-Mail und -Kennwort eintragen; das Plugin legt den Gateway-Container selbst an und zeigt seinen Zustand als Ampel."
K11 = "<b>Einbindung in Loxone</b> - Gateway V2 (Namenstabelle und Hakenliste), Befehle über MQTT (Liste und Vorlage), Ausfallerkennung, die vier Baustein-Listen aus dem LoxBerry-Plugins Musterprojekt; der bisherige Weg über HTTP steht eingeklappt darunter."
K12 = "<b>Ladungen</b> - die mitgeschriebenen Ladevorgänge: Dauer, Ladestand, Akkuinhalt am Ende, in den Akku geladen, Verbrauch je 100 km und - mit dem Strompreis aus dem Haus - Netzenergie, Durchschnittspreis und Kosten."
K13 = "<b>Test</b> - die Selbstprüfung. Sie beantwortet ohne Loxone, ob die Einrichtung trägt. Ein Strich ist dabei kein Haken, sondern heißt: nicht feststellbar."
K14 = "<b>Logdateien</b> - Zustandsänderungen, Befehle und Fehler. Passwort und Merkwort erscheinen maskiert."
K15 = "Die Endpunkte"
K16 = "Aufruf"
K17 = "Zweck"
K18 = "mg.php"
K19 = "die vollständige Loxone-Zeile"
K20 = "mg.php?zeile=laden"
K21 = "nur die Ladewerte, eigener Abfragetakt"
K22 = "mg.php?fahrzeug=2"
K23 = "das zweite eingerichtete Fahrzeug"
K24 = "mg.php?json=1"
K25 = "der Zustand als JSON"
K26 = "mg.php?cmd=ziel&amp;prozent=80&amp;token=T"
K27 = "Befehl ans Fahrzeug"
K28 = "mg.php?selftest=1&amp;token=T"
K29 = "nur prüfen, ob das Merkwort stimmt"
K30 = "Warum manche Aufrufe ein Merkwort brauchen"
K31 = "mg.php liegt im unangemeldeten Bereich, damit Loxone es ohne Zugangsdaten erreicht. Jeder Aufruf, der etwas auslöst, ist deshalb durch ein Merkwort geschützt - und seit 1.1.0 auch die Debug-Ansicht: dort stehen der iSMART-Benutzername, die Fahrzeug-Kennung und die Standortthemen."
K32 = "Wird ein neues Merkwort erzeugt, sind alle in Loxone eingetragenen Adressen neu zu übernehmen. Ein virtueller Ausgang wertet die Antwort nicht aus - der Ausfall bliebe sonst still."
K33 = "Die 12-Volt-Batterie"
K34 = "Jede Abfrage und jeder Befehl weckt die Fahrzeugelektronik. Die Entwickler des Gateways warnen ausdrücklich vor einer leergesaugten 12-Volt-Batterie. Das Plugin drosselt deshalb: Mindestabstand je Befehl, Obergrenze je Stunde, und ein Befehl, dessen Zielzustand schon anliegt, wird gar nicht erst gesendet. Ein Sollwert (Ziel-Ladestand, Ladestrom, Klimatemperatur, Sitzheizung, Abfragemodus und -takte), der mit demselben Wert vor weniger als 60 s hinausging, wird nicht erneut gesendet; die Antwort lautet dann OK=1 mit UNVERAENDERT=1. Dasselbe gilt für einen Zustand (Laden starten oder stoppen, Klima an, aus, vorn oder Gebläse, Heck- und Frontscheibenheizung, Batterieheizung), der vor weniger als 60 s an dasselbe Fahrzeug ging."
K35 = "Was ein Wert von minus eins bedeutet"
K36 = "Nicht jedes Modell liefert jeden Wert. Fehlt einer, sendet das Plugin -1, bei Temperaturen -99. Das ist kein Messwert, sondern die Aussage nicht bekannt. Die Vorlage für Loxone Config setzt MinVal passend, damit der Fehlwert wirklich negativ ankommt und sich von einer echten Null unterscheiden lässt."
K37 = "Ladeplan: belegt, aber nicht erprobt"
K38 = "Der Ladeplan und der Batterieheizplan stehen hinter einem eigenen Haken, und der ist ab Werk aus. Die Gestalt der Nachricht ist belegt - sie stammt aus dem Quelltext des Gateways, nicht aus einer Vermutung. Ob das Fahrzeug den Plan annimmt, ist an keinem Auto geprüft worden, und das kann keine Quelle beantworten. Diese Befehle melden deshalb OK=2, also abgesetzt mit unbekanntem Ergebnis, statt einen Erfolg zu behaupten."
K39 = "Es gibt ein zweites Plugin für dasselbe Auto"
K40 = "Das Plugin von Michael Schlenstedt installiert und betreibt das Gateway ebenfalls selbst. Beide beanspruchen den Ordnernamen mgismart; LoxBerry hängt beim zweiten eine Nummer an. Jedes legt nur seinen eigenen Container an, erkennbar am Label mit dem Ordnernamen, und fasst den des anderen nicht an. Und das MQTT-Gateway kennt zwei Fassungen: V1 verlangt das Abo von Hand, V2 erkennt die Themengruppe selbst. Der Reiter Einbindung in Loxone liest die Fassung aus der general.json und zeigt den passenden Satz."
K41 = "Lizenz"
K42 = "MIT."
K43 = "Der Gateway-Container"
K44 = "Das Plugin legt einen Container namens lb-&lt;Ordner&gt;-saic-gateway aus dem Abbild saicismartapi/saic-python-mqtt-gateway an, mit --network host und --restart unless-stopped. Er trägt die Labels de.loxberry.plugin.folder, .name, .def und .brokerhash. Übergeben werden iSMART-E-Mail und -Kennwort, Broker-Adresse, -Benutzer und -Kennwort, das Themen-Präfix und die Akkugröße je Fahrzeug - über eine Umgebungsdatei (Rechte 0600), die gleich danach gelöscht wird, nie über eine Befehlszeile. Die Adresse des iSMART-Servers und die Region setzt das Plugin nicht; es gilt die Vorgabe des Gateways."
K45 = "Jeder Eingriff - Neustart, Entfernen, Protokoll - trifft nur einen Container mit den eigenen Labels. Wer das Gateway zusätzlich von Hand betreibt, tut das ohne diese Labels; das Plugin fasst einen solchen Container nie an, und einer gleichen Namens verhindert nur das Anlegen. Kein Takt und kein Installationsschritt startet, stoppt oder entfernt den Container; nur die Deinstallation entfernt den eigenen, das Abbild bleibt."
K46 = "Zu wissen: docker inspect zeigt die Umgebungsvariablen des Containers samt Kennwörtern im Klartext, und jeder in der Gruppe docker darf das aufrufen. Wird das Broker-Kennwort im LoxBerry geändert, kennt der Container noch das alte - die Ampel zeigt dann gelb, und das Gateway ist neu anzulegen."
K47 = "Der Broker-Zugang"
K48 = "Ab Werk nimmt das Plugin Adresse, Port, Benutzer und Kennwort des Brokers aus der LoxBerry-Konfiguration (System - MQTT Gateway); der Reiter MQTT zeigt, woher sie kommen. Eigene Angaben gelten nur hinter dem Haken Eigene Broker-Angaben verwenden: mit Benutzer, oder ohne Anmeldung für einen Broker auf einem anderen Rechner. Ein Kennwort erscheint nie auf der Seite. Weist der Broker die Anmeldung ab, ist er nicht erreichbar oder liegt unter dem Präfix nichts, sagt das der Reiter Test mit einem eigenen Satz."
K49 = "Wann OK=1 gilt"
K50 = "OK ist 1, wenn die Momentaufnahme höchstens 3 Minuten alt ist (das Dreifache des Takts) und das Gateway sich nicht per Letztem Willen offline gemeldet hat - in allen Zeilen, auch laden und ort."
K51 = "Anmeldung bei MG"
K52 = "Das Gateway meldet unter account/lastLogin die letzte gelungene und unter account/lastLoginError die letzte gescheiterte Anmeldung bei MG. Ist der Fehler jünger als die Anmeldung oder gibt es nur den Fehler, zeigt die Ampel im Reiter Gateway einrichten rot: Anmeldung bei MG gescheitert, mit Zeitpunkt und Text. Dann iSMART-E-Mail und -Kennwort prüfen (am sichersten in der iSMART-App) und das Gateway neu anlegen. Fehlen beide Themen oder lassen sie sich nicht lesen, heißt das unbekannt, nicht in Ordnung; die Ampel zeigt dann grau. Über MQTT geht der Zustand bei jedem Takt als &lt;Praefix&gt;/gateway/anmeldung hinaus (1 in Ordnung, 0 gescheitert, - unbekannt), nicht retained wie ok, denn es ist eine Aussage des Gateways über sich selbst; im JSON des Endpunkts steht er als _gateway_anmeldung. Die Frage, ob das Gateway jedes Fahrzeug zuletzt erreicht hat, ist davon getrennt. Seit 1.1.23 liest die Ampel zuerst das Protokoll des Gateway-Containers (docker logs, die letzten 2000 Zeilen und die ersten 15 Minuten nach dem Start): Entscheidend ist die jüngste der Zeilen Logging in to SAIC API und Logged in as. Grün mit der Zeit der letzten Anmeldung, wenn auf den Versuch die Erfolgszeile folgt; gelb Anmeldung läuft, wenn nach 2 Minuten keine folgt; grau, solange sie jünger ist. Fehler beim Statusabruf mit return code 4 (das Fahrzeug schläft) sind kein Anmeldefehler; sie stehen als eigener Hinweis unter der Ampel. Wie das Gateway eine misslungene Anmeldung schreibt, ist am Gerät noch nicht gemessen; eine Zeile mit login und fail oder error zeigt die Ampel deshalb nur gelb als vermutlich gescheitert. E-Mail und Fahrzeugkennung werden dabei weder gezeigt noch gespeichert. Steht im Protokoll keine solche Zeile, gilt das oben Gesagte."
K53 = "Healthcheck des LoxBerry"
K54 = "Das Plugin meldet sich beim Healthcheck des LoxBerry (bin/healthcheck) mit fünf Punkten: läuft der Takt, nimmt der Broker die Anmeldung an, läuft der Gateway-Container (nur, wenn das Plugin ihn eingerichtet hat), ist die Anmeldung bei MG gelungen, und sind die Werte höchstens 3 Minuten alt. Geurteilt wird über das Alter der Werte, nicht über einen einzelnen Abruf. Docker und der Broker werden nur mit kurzer Zeitgrenze gefragt; geschrieben wird nichts. Ein Befehl, den das Fahrzeug nicht angenommen hat (etwa Rückgabe 4, das Fahrzeug schläft), ist nur ein Hinweis, kein Fehler. Dieselben Punkte stehen im Reiter Test."
K55 = "Gateway-Abbild aktualisieren"
K56 = "Der Knopf im Reiter Gateway einrichten holt das Abbild neu (docker pull, im Hintergrund, höchstens 15 Minuten). Läuft der eigene Container schon mit diesem Abbild, bleibt alles, wie es ist. Sonst hält das Plugin nur den eigenen Container an (erkennbar am Label des Plugins), benennt ihn um und legt den neuen mit denselben Einstellungen an; erst wenn der neue angelegt ist, wird der alte entfernt. Scheitert das, kommt der alte unverändert zurück, und der Reiter nennt den Grund; Zugangsdaten und Einstellungen bleiben gespeichert. Die Ampel zeigt die Fassung, die das Gateway unter account/gatewayVersion meldet, dazu Abbild und Digest des laufenden Containers. Von selbst wird nie aktualisiert."
K57 = "Neustart, Entfernen und Neuanlegen im Hintergrund"
K58 = "Gateway neu starten, Gateway entfernen, Gateway anlegen und Gateway-Abbild aktualisieren laufen im Hintergrund; die Seite antwortet sofort, zeigt den Vorgang mit seiner Dauer und lädt sich alle 5 s neu, bis er fertig ist. Ein hängendes Docker hält die Seite damit nicht mehr auf. Während ein Vorgang läuft, gibt es keinen zweiten. Wird ein vorhandener Container neu angelegt (auch beim Aktualisieren), hält das Plugin ihn an und benennt ihn um (Name mit -alt- und Zeit); erst wenn der neue angelegt ist, wird der alte entfernt. Scheitert das Anlegen, wird ein halb angelegter neuer entfernt und der alte unverändert zurückgeholt; lief er, läuft er wieder. Lässt sich der alte nach dem Erfolg nicht entfernen, bleibt er angehalten liegen, wird nie neu gestartet und beim nächsten Neuanlegen abgeräumt."
K59 = "Benachrichtigung bei geändertem Broker-Zugang"
K60 = "Der Gateway-Container meldet sich mit dem Broker-Zugang an, mit dem er angelegt wurde. Ändert sich danach das Kennwort des LoxBerry-Brokers (oder Benutzer, Adresse, Port, eigene Angaben im Reiter MQTT), legt das Plugin im Minutentakt eine Benachrichtigung in den Benachrichtigungsbereich des LoxBerry - einmal je Änderung, nicht jede Minute. Verglichen wird ein Fingerabdruck (kein Kennwort), der beim Anlegen in der Merkdatei neben dem Konfigordner notiert wird; bei einem Container aus einer früheren Fassung liest das Plugin ihn höchstens einmal je Stunde aus dem Label des Containers nach. Abhilfe: im Reiter Gateway einrichten Zugangsdaten übernehmen und Gateway neu anlegen. Stimmt der Zugang wieder, steht das im Protokoll."
K61 = "Nach einer Beanstandung"
K62 = "Wird beim Speichern ein Feld beanstandet, speichert das Plugin nichts, auch nicht die übrigen Felder dieses Formulars (Einstellungen, MQTT, iSMART-Zugang). Die eingetippten Werte stehen danach wieder im Formular, das beanstandete Feld ist rot umrandet; Kennwörter werden nie zurückgegeben, ihr Feld bleibt leer und wird nur markiert. Ein erneutes Laden zeigt wieder die gespeicherten Werte. Was früher still zurechtgebogen wurde (Leerzeichen in der VIN, ein geleertes Zeitfeld, Sekunden in einer Uhrzeit, Anführungszeichen im Fahrzeugnamen oder im iSMART-Benutzer, ein unbekannter Lademodus, ein Thema mit Leerzeichen, ein Broker-Kennwort ohne Benutzer), ist jetzt ebenfalls eine Beanstandung. Einstellungen sichern warnt gelb, wenn ein gespeicherter Wert das eigene Zurückspielen nicht bestehen würde, und nennt die Namen; die Datei trägt dann einen Kopf _warnung und wird trotzdem vollständig geliefert."
K63 = "MQTT-Gateway V2"
K64 = "Die Hausform ist das MQTT-Gateway V2 des LoxBerry. Es abonniert nur die Datenpunkte, die unter System - MQTT Gateway - Subscriptions angehakt sind. Welche das sind, zeigt der Reiter Einbindung in Loxone als Tabelle: Name des Virtuellen Eingangs, Thema, Noncached ja/nein. Textthemen (Name, Kennung, Klimatext) gehören nicht hinein, die Fahrzeugkennung nie. Der Reiter Test zählt nach, ob alle angehakt sind. Unter Gateway V1 gilt weiter das Abo mg/#."
K65 = "Befehle über MQTT"
K66 = "Loxone schickt Befehle über den gemeinsamen Ausgang LoxBerry MQTT-Gateway (UDP 11884) als publish mg/befehl/&lt;name&gt; &lt;wert&gt;; die Befehlsbrücke des Plugins prüft sie und quittiert unter .../quittung. Sicherheit: der UDP-Eingang 11884 ist im Heimnetz ohne Anmeldung erreichbar - jedes Gerät im WLAN kann dort senden. Schutz sind allein die Haken im Reiter MQTT, beide ab Werk aus. Eingreifende Befehle (Auto finden, Ver- und Entriegeln, Kofferraum öffnen) brauchen zusätzlich den zweiten Haken und Eingreifende Befehle erlauben. Der HTTP-Endpunkt mg.php bleibt für Bestandsanlagen; bei einer Neuinstallation ist er bis auf den Selbsttest gesperrt."
K67 = "Haus-Themen"
K68 = "Mit eigenen Haken (ab Werk aus) liest das Plugin haus/abfahrt (Minuten bis zur Abfahrt), haus/anwesenheit (jemand zu Hause, Ankunft) und haus/strompreis (Ladekosten). Ein abgekoppelter Leser wartet bis zu 65 s, bis jeder Zähler einmal live kam; der Minutenlauf wartet nie. Eine Quelle gilt, solange ihr Zähler sich binnen 120 s ändert; schweigt sie, gilt das bisherige Verhalten, und der Reiter Test sagt es. Das Plugin schreibt nichts unter haus/."
K69 = "Ladekosten"
K70 = "Während einer Ladung zu Hause merkt sich das Plugin je Minute Leistung und Endpreis aus haus/strompreis (ohne Grundpreis). Nach dem Ladeende stehen Netzenergie, Durchschnittspreis und Kosten im Reiter Ladungen und unter mg/&lt;n&gt;/ladung_kosten, ladung_kwh, ladung_preis. Fehlt der Preis für mehr als 10 % der Energie, bleiben die Kosten -1 - nie geschätzt."
K75 = "Kabel vergessen, Mindest-Akku, Sammelthemen"
K76 = "Zu Hause, Kabel nicht gesteckt, Akku unter der Schwelle: abends oder vor einer Abfahrt meldet sich das Plugin, höchstens einmal je Standzeit und je Tag. Unter dem Mindest-Akku unterbleibt die Vorklimatisierung (VORKLIMA 5, Kabel fehlt 6). Unter haus/fahrzeug/name stehen Ladestand, Reichweite, Kabel, laedt und zu Hause für andere Plugins."
K73 = "Sprachansagen"
K74 = "Das Plugin sagt Ereignisse ab Werk an: Reiter Einstellungen, Abschnitt Sprachansagen. Ausschalten mit der Ausgabeart aus; das bleibt auch nach einem Update aus. Nicht eingerichtete Lautsprecher werden übergangen, ohne Fehler. Nachts (ab Werk 22 bis 7 Uhr) entfällt eine Ansage und wird nicht nachgeholt. Der Schalter Ansagen aus in Loxone (haus/ansage/ruhe) lässt alle Plugins schweigen."
K71 = "Vorklimatisierung nur bei Kälte oder Hitze"
K72 = "Mit dem Haken liegt zwischen Kalt unter und Heiß über keine Vorklimatisierung an (Feld VORKLIMA = 2). Die Außentemperatur kommt zuerst aus Loxone (mg/befehl/aussentemp, höchstens 30 min alt), sonst vom Fahrzeug bei einem Stand bis 60 min. Ohne frischen Wert wird klimatisiert wie bisher. Je Abfahrt höchstens drei Versuche: Senden, Abfragen, Senden."
