; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.
; Erzeugt aus derselben Tabelle wie help.html und help_en.ini.

[HILFE]
K01 = "MG iSmart"
K02 = "Dieses Plugin bringt die Daten eines oder mehrerer MG-Elektrofahrzeuge nach Loxone und schickt Befehle zurueck."
K03 = "Es spricht nicht selbst mit MG, sondern liest die Werte von einem MQTT-Broker. Dort veroeffentlicht sie das quelloffene SAIC MQTT Gateway, ein Docker-Container."
K04 = "Der Weg der Daten"
K05 = "Fahrzeug - iSMART-Server - SAIC-MQTT-Gateway (Docker) - MQTT-Broker - dieses Plugin - Loxone"
K06 = "Das iSMART-Passwort kennt nur der Container. Dieses Plugin braucht es nicht."
K07 = "Die Reiter der Reihe nach"
K08 = "<b>Einstellungen</b> - Steuerung, Drosselung, Heimzone, Benachrichtigungen und die beiden Automatiken."
K09 = "<b>MQTT</b> - alles, was mit Themen zu tun hat: Broker, Themen-Praefix, iSMART-Benutzername, die Fahrzeuge und die eigene Veroeffentlichung. Dort steht auch die Tabelle aller Themen, die das Plugin selbst sendet."
K10 = "<b>Gateway einrichten</b> - der komplette docker-run-Befehl und die Stolperfallen."
K11 = "<b>Einbindung in Loxone</b> - acht Schritte, die komplette Baustein-Liste und die beiden Vorlagen fuer Loxone Config."
K12 = "<b>Ladungen</b> - die mitgeschriebenen Ladevorgaenge mit Dauer, kWh und Verbrauch je 100 km."
K13 = "<b>Test</b> - die Selbstpruefung. Sie beantwortet ohne Loxone, ob die Einrichtung traegt. Ein Strich ist dabei kein Haken, sondern heisst: nicht feststellbar."
K14 = "<b>Logdateien</b> - Zustandsaenderungen, Befehle und Fehler. Passwort und Merkwort erscheinen maskiert."
K15 = "Die Endpunkte"
K16 = "Aufruf"
K17 = "Zweck"
K18 = "mg.php"
K19 = "die vollstaendige Loxone-Zeile"
K20 = "mg.php?zeile=laden"
K21 = "nur die Ladewerte, eigener Abfragetakt"
K22 = "mg.php?fahrzeug=2"
K23 = "das zweite eingerichtete Fahrzeug"
K24 = "mg.php?json=1"
K25 = "der Zustand als JSON"
K26 = "mg.php?cmd=ziel&amp;prozent=80&amp;token=T"
K27 = "Befehl ans Fahrzeug"
K28 = "mg.php?selftest=1&amp;token=T"
K29 = "nur pruefen, ob das Merkwort stimmt"
K30 = "Warum manche Aufrufe ein Merkwort brauchen"
K31 = "mg.php liegt im unangemeldeten Bereich, damit Loxone es ohne Zugangsdaten erreicht. Jeder Aufruf, der etwas ausloest, ist deshalb durch ein Merkwort geschuetzt - und seit 1.1.0 auch die Debug-Ansicht: dort stehen der iSMART-Benutzername, die Fahrzeug-Kennung und die Standortthemen."
K32 = "Wird ein neues Merkwort erzeugt, sind alle in Loxone eingetragenen Adressen neu zu uebernehmen. Ein virtueller Ausgang wertet die Antwort nicht aus - der Ausfall bliebe sonst still."
K33 = "Die 12-Volt-Batterie"
K34 = "Jede Abfrage und jeder Befehl weckt die Fahrzeugelektronik. Die Entwickler des Gateways warnen ausdruecklich vor einer leergesaugten 12-Volt-Batterie. Das Plugin drosselt deshalb: Mindestabstand je Befehl, Obergrenze je Stunde, und ein Befehl, dessen Zielzustand schon anliegt, wird gar nicht erst gesendet."
K35 = "Was ein Wert von minus eins bedeutet"
K36 = "Nicht jedes Modell liefert jeden Wert. Fehlt einer, sendet das Plugin -1, bei Temperaturen -99. Das ist kein Messwert, sondern die Aussage nicht bekannt. Die Vorlage fuer Loxone Config setzt MinVal passend, damit der Fehlwert wirklich negativ ankommt und sich von einer echten Null unterscheiden laesst."
K37 = "Ladeplan: belegt, aber nicht erprobt"
K38 = "Der Ladeplan und der Batterieheizplan stehen hinter einem eigenen Haken, und der ist ab Werk aus. Die Gestalt der Nachricht ist belegt - sie stammt aus dem Quelltext des Gateways, nicht aus einer Vermutung. Ob das Fahrzeug den Plan annimmt, ist an keinem Auto geprueft worden, und das kann keine Quelle beantworten. Diese Befehle melden deshalb OK=2, also abgesetzt mit unbekanntem Ergebnis, statt einen Erfolg zu behaupten."
K39 = "Es gibt ein zweites Plugin fuer dasselbe Auto"
K40 = "Das Plugin von Michael Schlenstedt installiert und betreibt das Gateway selbst. Dieses hier setzt einen laufenden Gateway-Container voraus und legt den Schwerpunkt auf die Loxone-Seite. Beide beanspruchen den Ordnernamen mgismart; LoxBerry haengt beim zweiten eine Nummer an. Und das MQTT-Gateway kennt zwei Fassungen: V1 verlangt das Abo von Hand, V2 erkennt die Themengruppe selbst. Der Reiter Einbindung in Loxone liest die Fassung aus der general.json und zeigt den passenden Satz."
K41 = "Lizenz"
K42 = "MIT."
